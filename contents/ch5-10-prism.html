<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기둥 펼치기 — 겉넓이와 부피</title>
<link rel="stylesheet" href="../assets/common.css?v=4">
<script src="../assets/common.js?v=4" data-home="../index.html?unit=5" defer></script>
<script src="../assets/track.js?v=11" defer></script>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font); background:var(--bg); color:var(--ink); overflow:hidden;}
  #app{height:100%; display:flex; flex-direction:column;}

  header{
    display:flex; align-items:center; gap:16px; padding:0 16px; height:52px; flex:none;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1{font-size:17px; font-weight:800; white-space:nowrap;}
  header nav{display:flex; gap:5px;}
  header nav button{
    font:600 14px/1 var(--font); padding:8px 12px; border-radius:9px;
    border:1px solid transparent; background:none; color:var(--sub); cursor:pointer; white-space:nowrap;
  }
  header nav button:hover{background:var(--accent-soft); color:var(--accent);}
  header nav button.on{background:var(--accent-soft); color:var(--accent); border-color:#c7d3f7;}

  main{flex:1; min-height:0; padding:12px; display:grid; grid-template-columns:1fr 356px; gap:12px;}
  .board-wrap{
    position:relative; min-width:0;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  #board{width:100%; height:100%; display:block; touch-action:none;}
  #tip{
    position:absolute; right:12px; bottom:11px; pointer-events:none;
    font-size:12.5px; font-weight:600; color:var(--sub);
    background:#f7f9fdd9; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
  }
  #tip:empty{display:none;}

  aside{min-width:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px;}
  .blk{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px;}
  .blk h2{font-size:14px; font-weight:800; margin-bottom:9px; display:flex; align-items:center; gap:6px;}
  .blk h2 .tag{font-size:11px; font-weight:700; color:#fff; background:var(--accent); padding:3px 8px; border-radius:6px;}
  .blk p{font-size:13.5px; line-height:1.65; color:var(--sub);}
  .blk p b{color:var(--ink);}

  .row{display:flex; flex-wrap:wrap; gap:6px;}
  .btn{
    font:600 14px/1 var(--font); padding:9px 13px; border-radius:9px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; transition:.14s;
  }
  .btn:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-dark); color:#fff;}
  .btn.sm{padding:7px 10px; font-size:13px;}
  .btn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

  .kinds{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px;}

  .slider{margin-top:11px;}
  .slider label{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:700; margin-bottom:5px;}
  .slider label .v{color:var(--accent); font-size:14px;}
  input[type=range]{width:100%; accent-color:var(--accent);}

  .fb{font-size:13.5px; font-weight:600; line-height:1.6; padding:9px 11px; border-radius:9px; margin-top:9px;}
  .fb.ok{background:var(--ok-soft); color:var(--ok);}
  .fb.no{background:var(--no-soft); color:var(--no);}
  .fb.info{background:var(--accent-soft); color:var(--accent-dark);}
  .fb.warn{background:var(--warn-soft); color:#a75c00;}

  .calc{
    margin-top:10px; background:#f7f9fd; border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; font-size:13.5px; font-weight:700; line-height:1.95; color:var(--ink);
  }
  .calc .step{color:var(--sub); font-size:12.5px; font-weight:600;}
  .calc .res{color:var(--accent); font-size:16px;}
  .it{font-family:'Times New Roman',serif; font-style:italic; font-weight:700;}

  .ansrow{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .ansrow input{
    width:104px; font:700 17px var(--font); padding:9px 10px;
    border:1px solid var(--line); border-radius:9px; text-align:center;
  }
  .ansrow input.good{border-color:var(--ok); background:var(--ok-soft); color:var(--ok);}
  .ansrow input.bad {border-color:var(--no); background:var(--no-soft); color:var(--no);}
  .ansrow .unit{font-size:14px; font-weight:700; color:var(--sub);}

  .scoreboard{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .sc{background:#f7f9fd; border:1px solid var(--line); border-radius:10px; padding:9px 6px; text-align:center;}
  .sc .v{font-size:21px; font-weight:800; line-height:1.1;}
  .sc .l{font-size:11px; color:var(--sub); margin-top:3px;}
  .sc.ok .v{color:var(--ok);}

  .hidden{display:none !important;}

  @media (max-width:900px){
    body{overflow:auto;}
    #app{height:auto; min-height:100%;}
    main{grid-template-columns:1fr; height:auto;}
    .board-wrap{height:50vh; min-height:320px;}
    header{flex-wrap:wrap; height:auto; padding:8px 12px; gap:10px;}
    header nav{order:3; width:100%;}
    header nav button{flex:1; padding:8px 4px;}
  }
</style>
</head>
<body>
<div id="app">

<header>
  <h1>📦 기둥 펼치기</h1>
  <nav>
    <button class="on" data-tab="net">① 전개도로 펼치기</button>
    <button data-tab="vol">② 부피 쌓아 보기</button>
    <button data-tab="quiz">③ 스스로 풀기</button>
  </nav>
  <a class="home-btn" href="../index.html?unit=5">← 목차</a>
</header>

<main>
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div id="tip"></div>
  </div>

  <aside>
    <!-- ① 전개도 -->
    <section id="pNet">
      <div class="blk">
        <h2><span class="tag">활동 1</span> 기둥을 펼쳐 겉넓이를 구해요</h2>
        <p>기둥을 펼치면 <b>밑면 2개</b>와 <b>옆면 1개</b>가 돼요.
           옆면은 가로가 <b>밑면의 둘레</b>, 세로가 <b>높이</b> 인 직사각형이에요. (교과서 206~207쪽)</p>
        <div class="kinds" id="kindBtns">
          <button class="btn sm on" data-k="cyl">원기둥</button>
          <button class="btn sm" data-k="tri">삼각기둥</button>
          <button class="btn sm" data-k="rect">직육면체</button>
        </div>
        <div class="slider">
          <label><span id="lR">밑면 반지름 <span class="it">r</span></span><span class="v" id="vR">2 cm</span></label>
          <input type="range" id="rR" min="1" max="6" step="1" value="2">
        </div>
        <div class="slider">
          <label><span>높이 <span class="it">h</span></span><span class="v" id="vH">6 cm</span></label>
          <input type="range" id="rH" min="2" max="12" step="1" value="6">
        </div>
        <div class="slider">
          <label><span>펼치기</span><span class="v" id="vT">0 %</span></label>
          <input type="range" id="rT" min="0" max="100" step="1" value="0">
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn primary sm" id="btnOpen">▶ 천천히 펼치기</button>
          <button class="btn sm" id="btnClose">↺ 접기</button>
        </div>
        <div class="calc" id="netCalc"></div>
        <div id="netFb"></div>
      </div>
    </section>

    <!-- ② 부피 -->
    <section id="pVol" class="hidden">
      <div class="blk">
        <h2><span class="tag">활동 2</span> 밑면을 높이만큼 쌓아요</h2>
        <p>기둥의 부피는 <b>밑넓이 × 높이</b> 예요. 밑면을 한 층씩 쌓아 올려 보세요.
           (교과서 208~209쪽)</p>
        <div class="slider">
          <label><span>밑넓이</span><span class="v" id="vB">12 cm²</span></label>
          <input type="range" id="rB" min="4" max="24" step="2" value="12">
        </div>
        <div class="slider">
          <label><span>높이</span><span class="v" id="vVH">5 cm</span></label>
          <input type="range" id="rVH" min="1" max="10" step="1" value="5">
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn primary sm" id="btnStack">▶ 한 층씩 쌓기</button>
          <button class="btn sm" id="btnClear2">↺ 지우기</button>
        </div>
        <div class="calc" id="volCalc"></div>
        <div id="volFb"></div>
      </div>
    </section>

    <!-- ③ 퀴즈 -->
    <section id="pQuiz" class="hidden">
      <div class="blk">
        <h2><span class="tag">활동 3</span> 스스로 풀기</h2>
        <p id="ask"></p>
        <div class="ansrow">
          <input type="number" id="ansIn" placeholder="?" inputmode="decimal" step="any">
          <span class="unit" id="unit">cm²</span>
        </div>
        <p style="margin-top:7px;font-size:12.5px;" id="hintPi">π 가 있는 답은 π 를 빼고 <b>숫자만</b> 적어 주세요.</p>
        <div id="quizFb"></div>
        <div class="row" style="margin-top:10px;">
          <button class="btn primary" id="btnCheck">✅ 확인</button>
          <button class="btn sm" id="btnNext">🔄 새 문제</button>
        </div>
        <div class="scoreboard">
          <div class="sc"><div class="v" id="qTry">0</div><div class="l">푼 문제</div></div>
          <div class="sc ok"><div class="v" id="qOk">0</div><div class="l">맞힘</div></div>
          <div class="sc"><div class="v" id="qStreak">0</div><div class="l">연속</div></div>
        </div>
      </div>
    </section>
  </aside>
</main>

</div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);

const DW = 900, DH = 600;
const INK = "#1d2433", SUB = "#68738a";
const BLUE = "#3e63dd", RED = "#e5484d", OK = "#2f9e63", ORANGE = "#f5820b", PURPLE = "#8e4ec6";
const rad = d => d*Math.PI/180;
const clamp01 = v => Math.max(0, Math.min(1, v));

const cv = $("board"), ctx = cv.getContext("2d");
function view(){
  const W = cv.clientWidth, H = cv.clientHeight;
  const s = Math.min(W/DW, H/DH);
  return {s, ox:(W - DW*s)/2, oy:(H - DH*s)/2, W, H};
}
function seg(a, b, color, w, dash){
  ctx.save(); if(dash) ctx.setLineDash(dash);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}
function txt(t, x, y, color, size, halo){
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 " + size + "px Pretendard, 'Malgun Gothic', sans-serif";
  if(halo){ ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; ctx.lineJoin = "round"; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function rect(x, y, w, h, fill, stroke, lw){
  ctx.beginPath(); ctx.rect(x, y, w, h);
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2.4; ctx.stroke(); }
}
function ellipse(cx, cy, rx, ry, fill, stroke, lw){
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7);
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2.4; ctx.stroke(); }
}
function poly(pts, fill, stroke, lw){
  ctx.beginPath();
  pts.forEach(function(p, i){ i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2.4; ctx.stroke(); }
}
const r2 = v => Math.round(v*100)/100;
function frac(n, d){
  const g = (function gcd(a, b){ return b ? gcd(b, a % b) : a; })(Math.abs(n), Math.abs(d));
  return (d/g === 1) ? String(n/g) : (n/g) + "/" + (d/g);
}

/* ============================================================
   상태
   ============================================================ */
let tab = "net";
let kind = "cyl", rr = 2, hh = 6, tOpen = 0, openAnim = null;   /* ① */
let base = 12, vh = 5, stack = 0, stackAnim = null, stackSeen = false;   /* ② */
let Q = {kind:"cylS", r:0, h:0, a:0, b:0, ans:0, pi:false, done:false, tries:0, ok:0, streak:0};

/* ============================================================
   ① 전개도로 펼치기 — 3차원으로 실제로 접혔다 펴진다
   · 밑면 다각형을 꼭짓점 차례(시계 반대 방향)로 두고, 가운데 옆면 하나(f)를 앞에 세워 고정한다.
   · 옆면 띠 : 이웃 옆면은 세로 모서리를 경첩 삼아 돌아간다. 접힌 상태의 꺾인 각(밑면의 외각)을
     (1 - u) 배로 줄여 가면 u = 1 에서 한 줄로 펴진다 — 옆면 하나하나는 늘어나거나 줄지 않는다.
   · 밑면 두 개 : 고정 옆면의 아래·위 모서리에 붙어, 그 모서리를 축으로 90° 젖혀진다.
     그래서 다 펴면 밑면의 각 변과 옆면의 가로가 꼭 맞물린다.
   · 원기둥은 밑면을 정48각형(둘레 = 2πr)으로 보고 같은 방법으로 말린 옆면을 푼다.
   · 순서 : 먼저 밑면(뚜껑)이 열리고 → 옆면 띠가 펴진다. 보는 각도도 비스듬히 → 정면으로 돌린다.
   ============================================================ */
const EDGE_C = [RED, OK, PURPLE, ORANGE];                 /* 밑면의 변 ↔ 옆면의 가로 짝 색 */
function basePoly(){
  if(kind === "tri")  return {V:[[0, 0], [4, 0], [0, 3]], f:0, smooth:false};          /* 4·5·3 */
  if(kind === "rect") return {V:[[0, 0], [rr, 0], [rr, 4], [0, 4]], f:0, smooth:false};
  const N = 48, L = 2*Math.PI*rr/N, R = L/(2*Math.sin(Math.PI/N)), V = [];
  for(let i = 0; i < N; i++){ const a = -Math.PI/2 - Math.PI/N + i*2*Math.PI/N; V.push([R*Math.cos(a), R*Math.sin(a)]); }
  return {V, f:0, smooth:true};
}
function netModel(){
  const P = basePoly(), V = P.V, n = V.length, f = P.f;
  const L = [], dir = [], th = [];
  for(let i = 0; i < n; i++){
    const a = V[i], b = V[(i + 1)%n];
    L.push(Math.hypot(b[0] - a[0], b[1] - a[1])); dir.push(Math.atan2(b[1] - a[1], b[0] - a[0]));
  }
  for(let i = 0; i < n; i++){                             /* 꼭짓점 i+1 의 외각 */
    let d = dir[(i + 1)%n] - dir[i];
    while(d <= -Math.PI) d += 2*Math.PI; while(d > Math.PI) d -= 2*Math.PI;
    th.push(d);
  }
  /* 고정 옆면의 밑변이 원점에서 +x 방향이 되도록 밑면을 옮긴다(몸통은 +y 쪽, 보는 사람은 -y 쪽) */
  const c = Math.cos(-dir[f]), s = Math.sin(-dir[f]), o = V[f];
  const loc = V.map(p => [ (p[0] - o[0])*c - (p[1] - o[1])*s, (p[0] - o[0])*s + (p[1] - o[1])*c ]);
  return {n, f, L, th, loc, smooth:P.smooth};
}
/* 옆면 띠 : u = 0 접힘 → 1 펼침. 옆면마다 밑변의 두 끝(a → b, 밑면 꼭짓점 차례)을 준다 */
function stripAt(M, u){
  const {n, f, L, th} = M, out = [{i:f, a:[0, 0], b:[L[f], 0]}];
  const F = Math.floor((n - 1)/2), Bk = n - 1 - F;
  let P = [L[f], 0], ph = 0;
  for(let j = 1; j <= F; j++){
    const i = (f + j)%n; ph += th[(f + j - 1)%n]*(1 - u);
    const Q = [P[0] + L[i]*Math.cos(ph), P[1] + L[i]*Math.sin(ph)];
    out.push({i, a:P, b:Q}); P = Q;
  }
  P = [0, 0]; let ps = Math.PI;
  for(let j = 1; j <= Bk; j++){
    const i = (f - j + n)%n; ps -= th[i]*(1 - u);
    const Q = [P[0] + L[i]*Math.cos(ps), P[1] + L[i]*Math.sin(ps)];
    out.push({i, a:Q, b:P}); P = Q;
  }
  return out;
}
const ease = v => { v = clamp01(v); return v*v*(3 - 2*v); };
function netState(t){
  const M = netModel();
  return {M, beta:Math.PI/2*ease(t/0.42), u:ease((t - 0.32)/0.68),
          yaw:rad(kind === "tri" ? 34 : -34)*(1 - ease(t)),   /* 삼각기둥은 왼쪽(3 cm) 옆면이 보이게 반대쪽에서 */
          pitch:rad(32)*(1 - ease((t - 0.1)/0.9)), H:hh};
}
/* 밑면 점 → 3차원 (아래 밑면은 아래로, 위 밑면은 위로 젖혀진다) */
function basePt(S, p, top){
  const cb = Math.cos(S.beta), sb = Math.sin(S.beta);
  return top ? {x:p[0], y:p[1]*cb, z:S.H + p[1]*sb} : {x:p[0], y:p[1]*cb, z:-p[1]*sb};
}
function prj3(S, p){
  const cx = S.M.L[S.M.f]/2;
  const x0 = p.x - cx, y0 = p.y, z0 = p.z - S.H/2;
  const cy = Math.cos(S.yaw), sy = Math.sin(S.yaw), cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
  const X = x0*cy - y0*sy, Y = x0*sy + y0*cy;
  return {x:X, y:-(z0*cp + Y*sp), d:Y*cp - z0*sp};
}
function viewDepthOf(S, v){       /* 방향 벡터가 보는 사람에게서 멀어지면 + */
  const cy = Math.cos(S.yaw), sy = Math.sin(S.yaw), cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
  return (v.x*sy + v.y*cy)*cp - v.z*sp;
}
function netFaces(S){
  const M = S.M, faces = [];
  stripAt(M, S.u).forEach(function(q){
    const A = {x:q.a[0], y:q.a[1]}, B = {x:q.b[0], y:q.b[1]};
    const W = [{x:A.x, y:A.y, z:0}, {x:B.x, y:B.y, z:0}, {x:B.x, y:B.y, z:S.H}, {x:A.x, y:A.y, z:S.H}];
    const dx = B.x - A.x, dy = B.y - A.y, dl = Math.hypot(dx, dy) || 1;
    faces.push({kind:"side", i:q.i, W, n:{x:dy/dl, y:-dx/dl, z:0}});
  });
  faces.push({kind:"base", top:false, W:M.loc.map(p => basePt(S, p, false))});
  faces.push({kind:"base", top:true,  W:M.loc.map(p => basePt(S, p, true))});
  return faces;
}
function netBox3(t){
  const S = netState(t), b = {x0:1e9, x1:-1e9, y0:1e9, y1:-1e9};
  netFaces(S).forEach(F => F.W.forEach(p => { const q = prj3(S, p);
    b.x0 = Math.min(b.x0, q.x); b.x1 = Math.max(b.x1, q.x); b.y0 = Math.min(b.y0, q.y); b.y1 = Math.max(b.y1, q.y); }));
  return b;
}
function drawNet(){
  const t = clamp01(tOpen), S = netState(t), M = S.M;
  /* 1 cm 의 크기 : 접힌 모습·펼치는 중·전개도 모두 캔버스(가로 780 × 세로 430) 안에 */
  let mw = 0, mh = 0;
  [0, 0.5, 1].forEach(function(k){ const b = netBox3(k); mw = Math.max(mw, b.x1 - b.x0); mh = Math.max(mh, b.y1 - b.y0); });
  const SC = Math.min(36, 780/mw, 410/mh);
  const B = netBox3(t), OX = 450 - (B.x0 + B.x1)/2*SC, OY = 335 - (B.y0 + B.y1)/2*SC;
  const SP = p => { const q = prj3(S, p); return {x:OX + q.x*SC, y:OY + q.y*SC, d:q.d}; };
  const Ld = {x:-0.35, y:-0.75, z:0.56};

  const faces = netFaces(S).map(function(F){
    const P = F.W.map(SP);
    const d = P.reduce((s, p) => s + p.d, 0)/P.length;
    let n = F.n;
    if(!n){ const a = F.W[0], b = F.W[1], c = F.W[2];
      const u1 = {x:b.x - a.x, y:b.y - a.y, z:b.z - a.z}, u2 = {x:c.x - a.x, y:c.y - a.y, z:c.z - a.z};
      n = {x:u1.y*u2.z - u1.z*u2.y, y:u1.z*u2.x - u1.x*u2.z, z:u1.x*u2.y - u1.y*u2.x};
      const l = Math.hypot(n.x, n.y, n.z) || 1; n = {x:n.x/l, y:n.y/l, z:n.z/l}; }
    const lit = 0.66 + 0.34*Math.abs(n.x*Ld.x + n.y*Ld.y + n.z*Ld.z);
    return Object.assign({}, F, {P, d, lit, out:viewDepthOf(S, n) < 0});
  });
  faces.sort((a, b) => b.d - a.d);
  const shade = (rgb, lit, add) => "rgb(" + rgb.map(c => Math.round(Math.min(255, c*lit + (add || 0)))).join(",") + ")";
  const SIDE_A = [120, 155, 238], SIDE_B = [150, 180, 245], SIDE_IN = [205, 216, 246], BASE = [253, 205, 150];
  for(const F of faces){
    ctx.beginPath(); F.P.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
    if(F.kind === "base"){
      ctx.fillStyle = shade(BASE, F.lit); ctx.fill();
      ctx.strokeStyle = ORANGE; ctx.lineWidth = 2.4; ctx.lineJoin = "round"; ctx.stroke();
    }else{
      const rgb = !F.out ? SIDE_IN : (M.smooth || F.i%2 === 0 ? SIDE_A : SIDE_B);
      ctx.fillStyle = shade(rgb, F.lit, F.out ? 0 : 10); ctx.fill();
      if(M.smooth){ ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.9; ctx.stroke(); }     /* 칸 사이 틈 메우기 */
      else { ctx.strokeStyle = BLUE; ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.stroke(); }
    }
  }
  /* 원기둥 : 옆면 띠의 테두리(위·아래 둘레와 자른 선) */
  const strip = stripAt(M, S.u);
  if(M.smooth){
    const chain = [];
    const back = strip.filter((q, k) => k > Math.floor((M.n - 1)/2)).reverse();
    const fwd = strip.slice(0, Math.floor((M.n - 1)/2) + 1);
    back.concat(fwd).forEach(q => chain.push(q));
    const line = (z, w) => { ctx.beginPath(); chain.forEach((q, k) => { const A = SP({x:q.a[0], y:q.a[1], z}); if(!k) ctx.moveTo(A.x, A.y); else ctx.lineTo(A.x, A.y); });
      const lq = chain[chain.length - 1], Z = SP({x:lq.b[0], y:lq.b[1], z}); ctx.lineTo(Z.x, Z.y); ctx.strokeStyle = BLUE; ctx.lineWidth = w; ctx.stroke(); };
    if(S.u > 0.02){
      line(0, 2.4); line(S.H, 2.4);
      const c0 = chain[0], c1 = chain[chain.length - 1];
      seg(SP({x:c0.a[0], y:c0.a[1], z:0}), SP({x:c0.a[0], y:c0.a[1], z:S.H}), BLUE, 2.4);
      seg(SP({x:c1.b[0], y:c1.b[1], z:0}), SP({x:c1.b[0], y:c1.b[1], z:S.H}), BLUE, 2.4);
    }
  }

  /* 글자 */
  if(t < 0.04){
    /* 접힌 기둥 : 높이와 밑면 크기 */
    let best = null;
    strip.forEach(function(q){ [q.a, q.b].forEach(function(v){ const p = SP({x:v[0], y:v[1], z:0}); if(!best || p.x > best.p.x) best = {p, v}; }); });
    const p0 = best.p, p1 = SP({x:best.v[0], y:best.v[1], z:S.H});
    seg({x:p0.x + 18, y:p0.y}, {x:p1.x + 18, y:p1.y}, INK, 2);
    txt("높이 " + hh + " cm", p0.x + 70, (p0.y + p1.y)/2, INK, 16, true);
    if(M.smooth){
      const top = M.loc.map(p => SP(basePt(S, p, true)));
      const cxp = top.reduce((s, p) => s + p.x, 0)/top.length, cyp = top.reduce((s, p) => s + p.y, 0)/top.length;
      const rp = SP(basePt(S, [M.L[M.f]/2, 0], true));
      seg({x:cxp, y:cyp}, rp, ORANGE, 2.2, [6, 5]);
      txt(rr + " cm", (cxp + rp.x)/2 + 22, (cyp + rp.y)/2 + 4, ORANGE, 15, true);
    }
  }
  if(t > 0.93){
    const all = []; faces.forEach(F => F.P.forEach(p => all.push(p)));
    const yMax = Math.max.apply(null, all.map(p => p.y));
    const left = strip.reduce((m, q) => Math.min(m, q.a[0], q.b[0]), 1e9);
    const right = strip.reduce((m, q) => Math.max(m, q.a[0], q.b[0]), -1e9);
    const L0 = SP({x:left, y:0, z:0}), L1 = SP({x:left, y:0, z:S.H});
    seg({x:L0.x - 18, y:L0.y}, {x:L1.x - 18, y:L1.y}, INK, 2);
    txt(hh + " cm", L0.x - 52, (L0.y + L1.y)/2, INK, 16, true);
    if(M.smooth){
      const mid = SP({x:(left + right)/2, y:0, z:S.H*0.22});
      txt("가로 = 밑면의 둘레 = 2π×" + rr + " = " + (2*rr) + "π cm", mid.x, mid.y, BLUE, 16, true);
      const top = M.loc.map(p => SP(basePt(S, p, true)));
      const cxp = top.reduce((s, p) => s + p.x, 0)/top.length, cyp = top.reduce((s, p) => s + p.y, 0)/top.length;
      seg({x:cxp, y:cyp}, {x:cxp + rr*SC, y:cyp}, ORANGE, 2.2, [6, 5]);
      txt(rr + " cm", cxp + rr*SC/2, cyp - 13, ORANGE, 15, true);
    }else{
      /* 밑면의 변과 옆면의 가로를 같은 색으로 — 길이가 같아 꼭 맞물린다 */
      strip.forEach(function(q){
        const c = EDGE_C[q.i%EDGE_C.length];
        const a = SP({x:q.a[0], y:0, z:0}), b = SP({x:q.b[0], y:0, z:0});
        seg({x:a.x + 3, y:a.y - 2}, {x:b.x - 3, y:b.y - 2}, c, 5);
        txt(M.L[q.i] + " cm", (a.x + b.x)/2, a.y - 18, c, 15, true);
      });
      for(let i = 0; i < M.n; i++){
        if(i === M.f) continue;
        const c = EDGE_C[i%EDGE_C.length];
        [false, true].forEach(function(top){
          const a = SP(basePt(S, M.loc[i], top)), b = SP(basePt(S, M.loc[(i + 1)%M.n], top));
          seg(a, b, c, 5);
        });
      }
      const per = M.L.reduce((s, v) => s + v, 0);
      txt("옆면의 가로 = 밑면의 둘레 = " + M.L.join(" + ") + " = " + per + " cm", 450, Math.min(575, yMax + 26), BLUE, 16, true);
    }
  }
  txt(t > 0.93 ? "전개도 — 밑면 2개 + 옆면" : (t < 0.04 ? M.smooth ? "원기둥" : (kind === "tri" ? "삼각기둥" : "직육면체") : "펼치는 중…"),
      450, 52, t > 0.93 ? OK : INK, 21, true);
  $("tip").textContent = t > 0.93 ? (M.smooth ? "밑면 원이 옆면 직사각형의 위·아래에 맞닿아요" : "같은 색 변끼리 길이가 같아요")
                                  : "펼치기 슬라이더를 밀어 보세요";
}

function prismInfo(){
  if(kind === "cyl"){
    const b = Math.PI*rr*rr, side = 2*Math.PI*rr*hh;
    return {name:"원기둥", baseTxt:"π×" + rr + "² = " + (rr*rr) + "π cm²",
            sideTxt:"(2π×" + rr + ")×" + hh + " = " + (2*rr*hh) + "π cm²",
            surf:(2*rr*rr + 2*rr*hh), volCoef:(rr*rr*hh), pi:true};
  }
  if(kind === "tri"){
    const b = 3*4/2, per = 12, side = per*hh;
    return {name:"삼각기둥", baseTxt:"½×4×3 = 6 cm²",
            sideTxt:"(3+4+5)×" + hh + " = " + (12*hh) + " cm²",
            surf:(2*6 + 12*hh), volCoef:(6*hh), pi:false};
  }
  const b = rr*4, per = 2*(rr + 4);
  return {name:"직육면체", baseTxt:rr + "×4 = " + (rr*4) + " cm²",
          sideTxt:"(" + rr + "+4)×2×" + hh + " = " + (per*hh) + " cm²",
          surf:(2*rr*4 + per*hh), volCoef:(rr*4*hh), pi:false};
}

  $("vR").textContent = rr + " cm";

  $("rR").disabled = (kind === "tri");

    '<span class="res">' + info.surf + ' ' + u + '</span>';
  $("netFb").innerHTML = tOpen > 0.9
    ? '<div class="fb ok">🎉 <b>' + info.name + '</b>' + ((info.name.charCodeAt(info.name.length - 1) - 0xAC00) % 28 ? '을' : '를') + ' 펼쳤더니 <b>밑면 2개 + 옆면</b> 이 보이죠? 옆면의 가로는 <b>밑면의 둘레</b>,' +
      ' 세로는 <b>높이</b> 예요.</div>'
    : '<div class="fb info"><b>펼치기</b> 를 끝까지 밀어 전개도를 만들어 보세요.</div>';
  if(tOpen > 0.9 && window.MKSCORE) MKSCORE.once("net" + kind, 5, info.name + " 전개도 펼치기");
}

   ② 부피 쌓아 보기
   ============================================================ */
function drawVol(){
  /* 밑면(주황)을 한 층(1 cm)씩 위로 쌓는다. 층마다 앞·오른쪽·윗면을 그려 상자로 보이게, 아래층부터 */
  const cx = 400, yb = 505;
  const w = Math.min(330, 70 + base*11), d = 80, dx = d, dy = -d*0.55, layerH = Math.min(36, 330/vh);
  const x0 = cx - w/2, shown = Math.min(vh, stack);
  const cuboid = function(y, hgt, front, side, top, stroke, lw){
    poly([{x:x0 + w, y:y}, {x:x0 + w + dx, y:y + dy}, {x:x0 + w + dx, y:y + dy - hgt}, {x:x0 + w, y:y - hgt}], side, stroke, lw);
    poly([{x:x0, y:y - hgt}, {x:x0 + w, y:y - hgt}, {x:x0 + w + dx, y:y - hgt + dy}, {x:x0 + dx, y:y - hgt + dy}], top, stroke, lw);
    rect(x0, y - hgt, w, hgt, front, stroke, lw);
  };
  /* 다 쌓았을 때의 기둥 자리(점선) */
  ctx.save(); ctx.setLineDash([7, 6]);
  const Ht = vh*layerH;
  poly([{x:x0, y:yb - Ht}, {x:x0 + w, y:yb - Ht}, {x:x0 + w + dx, y:yb - Ht + dy}, {x:x0 + dx, y:yb - Ht + dy}], null, "#b8c3dc", 1.6);
  seg({x:x0, y:yb}, {x:x0, y:yb - Ht}, "#b8c3dc", 1.6); seg({x:x0 + w, y:yb}, {x:x0 + w, y:yb - Ht}, "#b8c3dc", 1.6);
  seg({x:x0 + w + dx, y:yb + dy}, {x:x0 + w + dx, y:yb + dy - Ht}, "#b8c3dc", 1.6);
  ctx.restore();
  /* 밑면 */
  poly([{x:x0, y:yb}, {x:x0 + w, y:yb}, {x:x0 + w + dx, y:yb + dy}, {x:x0 + dx, y:yb + dy}], ORANGE + "55", ORANGE, 2.6);
  for(let i = 0; i < shown; i++){
    const y = yb - i*layerH;
    const last = (i === shown - 1);
    cuboid(y, layerH, BLUE + "30", BLUE + "4a", last ? ORANGE + "40" : BLUE + "22", BLUE, 1.6);
  }
  txt("밑넓이 " + base + " cm²", cx + dx/2, yb + 28, ORANGE, 18, true);
  if(shown > 0){
    const topY = yb - shown*layerH;
    const hx = x0 + w + dx + 18;
    seg({x:hx, y:yb + dy}, {x:hx, y:topY + dy}, OK, 3);
    seg({x:hx - 6, y:yb + dy}, {x:hx + 6, y:yb + dy}, OK, 3); seg({x:hx - 6, y:topY + dy}, {x:hx + 6, y:topY + dy}, OK, 3);
    txt(shown + " cm", hx + 34, (yb + topY)/2 + dy, OK, 17, true);
  }
  txt(shown >= vh ? "밑넓이 × 높이 = " + base + " × " + vh + " = " + (base*vh) + " cm³" : "한 층씩 쌓는 중… (" + shown + "층)",
      450, 52, shown >= vh ? OK : INK, 21, true);
  $("tip").textContent = "밑면을 높이만큼 쌓으면 부피예요";
}
function paintVol(){
  $("vB").textContent = base + " cm²";
  $("vVH").textContent = vh + " cm";
  $("volCalc").innerHTML =
    '<span class="step">기둥의 부피</span><br>(밑넓이) × (높이) = ' + base + ' × ' + vh +
    ' = <span class="res">' + (base*vh) + ' cm³</span>';
  /* 두 번째부터 다 쌓은 것은 again — 다시 해 본 것이라 정답·완료로 또 세지 않는다 */
  const again = stackSeen;
  if(stack >= vh) stackSeen = true;
  $("volFb").innerHTML = stack >= vh
    ? '<div class="fb ok' + (again ? ' again' : '') + '">🎉 밑면을 <b>' + vh + '층</b> 쌓았어요. 부피는 <b>' + base + ' × ' + vh +
      ' = ' + (base*vh) + ' cm³</b> 예요.</div>'
    : '<div class="fb info"><b>한 층씩 쌓기</b> 를 눌러 보세요.</div>';
  if(stack >= vh && window.MKSCORE) MKSCORE.once("stack", 5, "기둥 부피 쌓기");
}
function stopStack(){ if(stackAnim){ cancelAnimationFrame(stackAnim); stackAnim = null; } }
$("rB").addEventListener("input", function(e){ stopStack(); base = +e.target.value; stack = 0; paintVol(); draw(); });
$("rVH").addEventListener("input", function(e){ stopStack(); vh = +e.target.value; stack = 0; paintVol(); draw(); });
$("btnStack").addEventListener("click", function(){
  stopStack(); stack = 0;
  const t0 = performance.now(), per = 320;
  (function step(now){
    stack = Math.min(vh, Math.floor((now - t0)/per) + 1);
    paintVol(); draw();
    if(stack < vh) stackAnim = requestAnimationFrame(step); else stackAnim = null;
  })(performance.now());
});
$("btnClear2").addEventListener("click", function(){ stopStack(); stack = 0; paintVol(); draw(); });

const QC = {x:430, y:320};
function drawQuiz(){
  const R = 88, H = 215;
  if(Q.kind.indexOf("cyl") === 0){
    const top = QC.y - H/2, bot = QC.y + H/2, ry = R*0.3;
    /* 옆면 : 위 타원 아래와 아래 타원 앞쪽 반을 이어 칠하고, 옆 두 선만 긋는다 */
    ctx.beginPath(); ctx.moveTo(QC.x - R, top); ctx.lineTo(QC.x - R, bot);
    ctx.ellipse(QC.x, bot, R, ry, 0, Math.PI, 0, true); ctx.lineTo(QC.x + R, top);
    ctx.ellipse(QC.x, top, R, ry, 0, 0, Math.PI, false); ctx.closePath();
    ctx.fillStyle = BLUE + "26"; ctx.fill();
    seg({x:QC.x - R, y:top}, {x:QC.x - R, y:bot}, BLUE, 2.6); seg({x:QC.x + R, y:top}, {x:QC.x + R, y:bot}, BLUE, 2.6);
    /* 아래 밑면 : 앞쪽 반은 실선, 뒤쪽 반은 점선(가려진 부분) */
    ctx.beginPath(); ctx.ellipse(QC.x, bot, R, ry, 0, 0, Math.PI); ctx.strokeStyle = BLUE; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.save(); ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.ellipse(QC.x, bot, R, ry, 0, Math.PI, 2*Math.PI); ctx.stroke(); ctx.restore();
    ellipse(QC.x, top, R, ry, "#ffffffee", BLUE, 2.4);
    seg({x:QC.x, y:top}, {x:QC.x + R, y:top}, INK, 2.2, [6, 5]);
    txt(Q.r + " cm", QC.x + R/2, top - 18, INK, 17, true);
    seg({x:QC.x + R + 24, y:top}, {x:QC.x + R + 24, y:bot}, INK, 2.2);
    txt(Q.h + " cm", QC.x + R + 62, QC.y, INK, 17, true);
  }else{
    const w = 215, d = 72, dx = d, dy = -d*0.55;
    const x0 = QC.x - w/2 - dx/2, y0 = QC.y + H/2;
    /* 가려진 모서리(점선)와 밑면 */
    poly([{x:x0, y:y0}, {x:x0 + w, y:y0}, {x:x0 + w + dx, y:y0 + dy}, {x:x0 + dx, y:y0 + dy}], ORANGE + "40", null);
    ctx.save(); ctx.setLineDash([6, 6]);
    seg({x:x0, y:y0}, {x:x0 + dx, y:y0 + dy}, BLUE, 2); seg({x:x0 + dx, y:y0 + dy}, {x:x0 + w + dx, y:y0 + dy}, BLUE, 2);
    seg({x:x0 + dx, y:y0 + dy}, {x:x0 + dx, y:y0 + dy - H}, BLUE, 2);
    ctx.restore();
    /* 보이는 면 : 오른쪽 옆면, 윗면, 앞면 */
    poly([{x:x0 + w, y:y0}, {x:x0 + w + dx, y:y0 + dy}, {x:x0 + w + dx, y:y0 + dy - H}, {x:x0 + w, y:y0 - H}], BLUE + "3a", BLUE, 2.4);
    poly([{x:x0, y:y0 - H}, {x:x0 + w, y:y0 - H}, {x:x0 + w + dx, y:y0 - H + dy}, {x:x0 + dx, y:y0 - H + dy}], BLUE + "1c", BLUE, 2.4);
    rect(x0, y0 - H, w, H, BLUE + "26", BLUE, 2.6);
    seg({x:x0 + w + dx + 18, y:y0 + dy}, {x:x0 + w + dx + 18, y:y0 + dy - H}, INK, 2.2);
    txt(Q.h + " cm", x0 + w + dx + 56, y0 - H/2 + dy, INK, 17, true);
    txt("밑넓이 " + Q.b + " cm²", x0 + w/2 + dx/2, y0 + 28, ORANGE, 18, true);
  }
  txt(Q.kind.slice(-1) === "S" ? "겉넓이는?" : "부피는?", 430, 52,
      Q.kind.slice(-1) === "S" ? BLUE : OK, 21, true);
  $("tip").textContent = "";
}
const QKINDS = ["cylS", "cylV", "priS", "priV"];
function newQuestion(){
  let k, guard = 0;
  do{ k = QKINDS[Math.floor(Math.random()*QKINDS.length)]; guard++; }while(guard < 12 && k === Q.kind);
  Q.kind = k; Q.done = false;
  if(k.indexOf("cyl") === 0){
    Q.r = 2 + Math.floor(Math.random()*5);          /* 2~6 */
    Q.h = 3 + Math.floor(Math.random()*9);          /* 3~11 */
    Q.pi = true;
    if(k === "cylS"){
      Q.ans = 2*Q.r*Q.r + 2*Q.r*Q.h;
      $("ask").innerHTML = '반지름이 <b>' + Q.r + ' cm</b>, 높이가 <b>' + Q.h +
        ' cm</b> 인 원기둥의 <b>겉넓이</b> 를 π 를 써서 구하세요.';
      $("unit").textContent = "π cm²";
    }else{
      Q.ans = Q.r*Q.r*Q.h;
      $("ask").innerHTML = '반지름이 <b>' + Q.r + ' cm</b>, 높이가 <b>' + Q.h +
        ' cm</b> 인 원기둥의 <b>부피</b> 를 π 를 써서 구하세요.';
      $("unit").textContent = "π cm³";
    }
  }else{
    /* 밑면을 실제 직사각형(가로 × 세로)으로 잡아, 밑넓이와 둘레가 서로 어긋나지 않게 한다
       (넓이 13 cm² 인데 둘레가 13 cm 인 다각형은 존재하지 않는다) */
    const bw = 2 + Math.floor(Math.random()*6);     /* 가로 2~7 */
    const bd = 2 + Math.floor(Math.random()*5);     /* 세로 2~6 */
    Q.b = bw*bd;                                    /* 밑넓이 */
    Q.a = 2*(bw + bd);                              /* 밑면 둘레 */
    Q.h = 3 + Math.floor(Math.random()*9);
    Q.pi = false;
    if(k === "priS"){
      Q.ans = 2*Q.b + Q.a*Q.h;
      $("ask").innerHTML = '밑넓이가 <b>' + Q.b + ' cm²</b>, 밑면의 둘레가 <b>' + Q.a +
        ' cm</b>, 높이가 <b>' + Q.h + ' cm</b> 인 각기둥의 <b>겉넓이</b> 를 구하세요.';
      $("unit").textContent = "cm²";
    }else{
      Q.ans = Q.b*Q.h;
      $("ask").innerHTML = '밑넓이가 <b>' + Q.b + ' cm²</b>, 높이가 <b>' + Q.h +
        ' cm</b> 인 각기둥의 <b>부피</b> 를 구하세요.';
      $("unit").textContent = "cm³";
    }
  }
  $("hintPi").style.display = Q.pi ? "" : "none";
  const inp = $("ansIn"); inp.value = ""; inp.className = "";
  $("quizFb").innerHTML = "";
  draw();
}
$("btnCheck").addEventListener("click", function(){
  if(Q.done) return;
  const inp = $("ansIn");
  if(inp.value === ""){ $("quizFb").innerHTML = '<div class="fb warn">답을 적어 주세요.</div>'; return; }
  const ok = Math.abs(+inp.value - Q.ans) < 1e-6;
  Q.done = true; Q.tries++;
  if(ok){ Q.ok++; Q.streak++; } else { Q.streak = 0; }
  inp.className = ok ? "good" : "bad";
  let how;
  if(Q.kind === "cylS")
    how = '(밑넓이)×2 + (옆넓이) = π×' + Q.r + '²×2 + (2π×' + Q.r + ')×' + Q.h +
          ' = ' + (2*Q.r*Q.r) + 'π + ' + (2*Q.r*Q.h) + 'π = <b>' + Q.ans + 'π cm²</b>';
  else if(Q.kind === "cylV")
    how = '(밑넓이)×(높이) = π×' + Q.r + '²×' + Q.h + ' = <b>' + Q.ans + 'π cm³</b>';
  else if(Q.kind === "priS")
    how = '(밑넓이)×2 + (밑면의 둘레)×(높이) = ' + Q.b + '×2 + ' + Q.a + '×' + Q.h +
          ' = <b>' + Q.ans + ' cm²</b>';
  else
    how = '(밑넓이)×(높이) = ' + Q.b + '×' + Q.h + ' = <b>' + Q.ans + ' cm³</b>';
  $("quizFb").innerHTML =
    '<div class="fb ' + (ok ? "ok" : "no") + '">' +
    (ok ? "🎉 정답! " : '아쉬워요. 답은 <b>' + Q.ans + '</b>. ') + how + '</div>';
  $("qTry").textContent = Q.tries; $("qOk").textContent = Q.ok; $("qStreak").textContent = Q.streak;
  if(window.MKSCORE) MKSCORE.quiz(ok, "기둥 겉넓이·부피");
});
$("btnNext").addEventListener("click", newQuestion);
$("ansIn").addEventListener("keydown", function(e){ if(e.key === "Enter") $("btnCheck").click(); });

/* ============================================================
   그리기 / 탭
   ============================================================ */
function draw(){
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const v = view();
  ctx.clearRect(0, 0, v.W, v.H);
  ctx.save();
  ctx.translate(v.ox, v.oy); ctx.scale(v.s, v.s);
  ctx.fillStyle = "#fff";
  ctx.fillRect(-v.ox/v.s, -v.oy/v.s, v.W/v.s, v.H/v.s);
  if(tab === "net") drawNet();
  else if(tab === "vol") drawVol();
  else drawQuiz();
  ctx.restore();
}
document.querySelectorAll("header nav button").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll("header nav button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    tab = b.dataset.tab;
    stopOpen(); stopStack();
    $("pNet") .classList.toggle("hidden", tab !== "net");
    $("pVol") .classList.toggle("hidden", tab !== "vol");
    $("pQuiz").classList.toggle("hidden", tab !== "quiz");
    draw();
  });
});
function boot(){
  paintNet();
  paintVol();
  newQuestion();
  tab = "net";
  if(window.MK && MK.fit) MK.fit(cv, draw);
  draw();
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
