    /* contents/sample-content.html 은 새 콘텐츠를 만들 때 베끼는 개발용 예시라

       현황판에서 신호가 끊긴 것처럼(빨강) 보이기 때문. 파일은 그대로 둔다. */

    // { title: "...", desc: "...", badge: "...", href: "contents/....html" },
  ];

  /* ---------- 단원 목록 ----------
     맨 앞이 홈 화면(처음 열었을 때 보이는 단원)이다.
     단원을 새로 시작하면 여기 맨 앞에 한 줄 추가하고,
     contentsList 항목에는 unit 값을 꼭 적는다. */
  const unitList = [
    {
      unit: 5,
      btn: "5단원",
      name: "Ⅴ. 도형의 성질",
      desc: "아래 카드를 눌러 다각형·원과 부채꼴·입체도형을 직접 움직여 보세요."
    },
    {
      unit: 4,
      btn: "4단원",
      name: "Ⅳ. 도형의 기초",
      desc: "아래 카드를 눌러 점·선·면, 위치 관계, 작도와 합동을 체험해 보세요."
    }
  ];

  const grid        = document.getElementById("card-grid");
  const emptyNotice = document.getElementById("empty-notice");
  const nav         = document.getElementById("unit-nav");
  const unitDesc    = document.getElementById("unit-desc");

  /* 주소에 ?unit=4 가 붙어 있으면 그 단원을, 없으면 홈 단원(맨 앞)을 연다.
     콘텐츠의 '목차' 버튼이 자기 단원으로 되돌아오기 위해 이 값을 쓴다. */
  const asked   = Number(new URLSearchParams(location.search).get("unit"));
  const initial = unitList.some(u => u.unit === asked) ? asked : unitList[0].unit;

  unitList.forEach(u => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "unit-btn";
    b.dataset.unit = u.unit;
    b.innerHTML = `<strong>${u.btn}</strong><span>${u.name}</span>`;
    b.addEventListener("click", () => show(u.unit));
    nav.appendChild(b);
  });

  function show(unit) {
    const info = unitList.find(u => u.unit === unit) || unitList[0];
    unitDesc.textContent = info.desc;
    document.title = `${info.name} — 수학 단원 콘텐츠 체험관`;

    nav.querySelectorAll(".unit-btn").forEach(b => {
      const on = Number(b.dataset.unit) === info.unit;
      b.classList.toggle("on", on);
      b.setAttribute("aria-current", on ? "true" : "false");
    });

    /* 홈 단원은 주소를 깨끗하게 두고, 다른 단원만 ?unit= 을 남긴다 */
    const url = info.unit === unitList[0].unit
      ? location.pathname
      : `${location.pathname}?unit=${info.unit}`;
    history.replaceState(null, "", url);

    const items = contentsList.filter(it => it.unit === info.unit);
    grid.innerHTML = "";
    emptyNotice.style.display = items.length ? "none" : "block";

    items.forEach(item => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = item.href;
      a.innerHTML = `
        <span class="badge">${item.badge ?? "콘텐츠"}</span>
        <h2>${item.title}</h2>
        <p>${item.desc ?? ""}</p>
      `;
      grid.appendChild(a);
    });
  }

  show(initial);
</script>
