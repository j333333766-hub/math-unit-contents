<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수학 단원 콘텐츠 체험관</title>
<link rel="stylesheet" href="assets/style.css" />
<script src="assets/track.js" defer></script>
</head>
<body>

<header class="page-header">
  <h1>수학 단원 콘텐츠 체험관</h1>
  <p>아래 카드를 눌러 이 단원의 다양한 콘텐츠를 체험해 보세요.</p>
</header>

<main>
  <div id="card-grid" class="card-grid"></div>
  <div id="empty-notice" class="empty-notice" style="display:none;">
    아직 등록된 콘텐츠가 없습니다. <code>contents</code> 폴더에 html 파일을 추가하고,
    아래 <code>contentsList</code> 배열에 항목을 추가해 주세요.
  </div>
</main>

<script>
  /*
    새 콘텐츠를 추가하는 방법
    1) contents 폴더 안에 새 html 파일을 만든다. (예: contents/기울기-탐구.html)
    2) 아래 contentsList 배열에 한 줄을 추가한다.
       title: 카드에 보일 제목
       desc : 카드에 보일 한 줄 설명
       badge: 콘텐츠 유형 (예: "개념", "예제", "연습문제", "탐구활동")
       href : contents 폴더 안 파일 경로
  */
  const contentsList = [
    {
      title: "픽셀 돋보기",
      desc: "사진을 끝까지 확대해서 화면이 작은 점(화소)으로 이루어져 있다는 걸 눈으로 확인해요. (교과서 137쪽)",
      badge: "중1 Ⅳ단원 · 점, 선, 면",
      href: "contents/01-pixel-zoom.html"
    },
    {
      title: "점·선·면 탐구실",
      desc: "입체도형을 돌려 보며 교점·교선을 세고, 직선·반직선·선분을 구별하고, 중점을 직접 찾아요. (교과서 137~139쪽)",
      badge: "중1 Ⅳ단원 · 점, 선, 면",
      href: "contents/02-point-line-plane.html"
    },
    {
      title: "두더지 잡기 — 동위각과 엇각",
      desc: "두더지가 나온 자리의 동위각·엇각을 제한 시간 안에 찾아 두드리는 게임이에요. (교과서 152쪽)",
      badge: "중1 Ⅳ단원 · 평행선의 성질",
      href: "contents/06-mole-game.html"
    },
    {
      title: "평행선 각 탐구실",
      desc: "직선을 기울여 보며 평행할 때만 동위각·엇각의 크기가 같아지는 것을 확인하고, 각의 크기를 구해요. (교과서 153~155쪽)",
      badge: "중1 Ⅳ단원 · 평행선의 성질",
      href: "contents/07-parallel-angles.html"
    },
    {
      title: "착시 실험실",
      desc: "폰조·뮐러리어·헤링·쵤너 착시를 직접 조작하고, 헤링 착시가 정말 평행한지 동위각으로 확인해요. (교과서 156쪽)",
      badge: "중1 Ⅳ단원 · 평행선의 성질",
      href: "contents/09-illusion.html"
    },
    {
      title: "각도 실험실",
      desc: "화면 각도기로 각을 직접 만들어 재고, 평각에서 각의 크기를 구하고, 맞꼭지각이 왜 같은지 따져 봐요. (교과서 141~143쪽)",
      badge: "중1 Ⅳ단원 · 각",
      href: "contents/03-angle-lab.html"
    },
    {
      title: "수선의 발과 거리",
      desc: "점을 직선 위에서 움직이며 길이가 가장 짧아지는 자리를 찾고, 모눈종이에서 거리를 재고, 수직이등분선을 만들어요. (교과서 144쪽)",
      badge: "중1 Ⅳ단원 · 각",
      href: "contents/04-perp-foot.html"
    },
    {
      title: "3D 위치 관계 탐험",
      desc: "입체도형을 손으로 돌리며 모서리 두 개를 고르면 평행·만남·꼬인 위치를 바로 판정해 줘요. 모서리와 면의 관계, 모두 찾기 도전까지. (교과서 146~151쪽)",
      badge: "중1 Ⅳ단원 · 위치 관계",
      href: "contents/05-space-3d.html"
    },
    {
      title: "삼각형 결정 조건",
      desc: "세 변으로 삼각형이 되는 조건을 두 원의 만남으로 확인하고, 끼인각이 아닐 때 삼각형이 두 개 생기는 장면을 직접 봐요. (교과서 159·163쪽)",
      badge: "중1 Ⅳ단원 · 삼각형의 작도",
      href: "contents/11-triangle-condition.html"
    },
    {
      title: "합동 포개기",
      desc: "삼각형을 옮기고 돌리고 뒤집어 포개 보며 대응 관계를 찾고, SSS·SAS·ASA 합동 조건을 판별해요. (교과서 165~167쪽)",
      badge: "중1 Ⅳ단원 · 삼각형의 합동",
      href: "contents/12-congruence.html"
    },
    {
      title: "보조선 도전",
      desc: "평행선 사이에서 꺾인 각을 보조선 하나로 푸는 과정을 단계별로 보고, 직접 풀어 봐요. (교과서 154~155쪽)",
      badge: "중1 Ⅳ단원 · 평행선의 성질",
      href: "contents/08-aux-line.html"
    },
    {
      title: "가상 작도판",
      desc: "눈금 없는 자와 컴퍼스만으로 선분·각·삼각형을 직접 작도해요. 교과서 순서를 따라가는 모드와 스스로 하는 자유 모드. (교과서 157~162쪽)",
      badge: "중1 Ⅳ단원 · 삼각형의 작도",
      href: "contents/10-construction.html"
    },
    {
      title: "에그 퍼즐",
      desc: "교과서 순서대로 달걀 모양을 작도해 보고, 9조각 중 합동인 짝을 찾고, 조각을 끌고 돌리고 뒤집어 나만의 모양을 만들어요. (교과서 174쪽)",
      badge: "중1 Ⅳ단원 · 창의 프로젝트",
      href: "contents/13-egg-puzzle.html"
    },
    {
      title: "흔들리지 않는 삼각형",
      desc: "사각형 틀과 삼각형 틀을 옆에서 밀어 보고, 다각형을 대각선으로 고정해 보고, 3층 건물을 보강해 지진을 견디게 만들어요. (교과서 175쪽)",
      badge: "중1 Ⅳ단원 · 수학 STORY",
      href: "contents/14-truss.html"
    },
    {
      title: "샘플 콘텐츠",
      desc: "새 콘텐츠를 만들 때 참고할 수 있는 예시 페이지입니다.",
      badge: "예시",
      href: "contents/sample-content.html"
    }
    // 여기에 콘텐츠를 계속 추가하세요.
    // { title: "...", desc: "...", badge: "...", href: "contents/....html" },
  ];

  const grid = document.getElementById("card-grid");
  const emptyNotice = document.getElementById("empty-notice");

  if (contentsList.length === 0) {
    emptyNotice.style.display = "block";
  } else {
    contentsList.forEach(item => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = item.href;
      a.innerHTML = `
        <span class="badge">${item.badge ?? "콘텐츠"}</span>
        <h2>${item.title}</h2>
        <p>${item.desc ?? ""}</p>
      `;
      grid.appendChild(a);
    });
  }
</script>

</body>
</html>
