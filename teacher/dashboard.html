<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수학 콘텐츠 학습 현황판</title>
<!-- ===========================================================
     교사용 현황판 (파이어베이스 판)

     · 학생 화면의 assets/track.js 가 파이어베이스로 보낸 기록을 실시간으로 받는다.
       예전 Apps Script 판처럼 몇 초마다 새로 묻지 않고, 바뀌는 즉시 화면이 바뀐다.
     · 아래 TEACHER 계정으로 구글 로그인해야 열린다. 로그인하지 않으면 데이터가
       한 줄도 내려오지 않는다(파이어베이스 보안 규칙이 막는다).
     · 학년·반은 여기서 [수업 시작] 을 누를 때 정해진다. 학생은 번호만 입력한다.
     =========================================================== -->
<style>
  :root{
    --bg:#f4f6fa; --panel:#fff; --line:#e3e8f0; --ink:#1d2433; --sub:#68738a;
    --accent:#3e63dd; --ok:#2f9e63; --warn:#f5820b; --no:#e5484d;
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%;}
  body{font-family:var(--font); background:linear-gradient(180deg,#eef2fb 0%,#f5f7fb 40%,#f3f5f9 100%); color:var(--ink); overflow:hidden;}
  #app{display:none; height:100vh; height:100dvh; flex-direction:column; gap:6px; padding:8px 10px 10px;}
  .btn{font:700 13px/1 var(--font); padding:7px 10px; border-radius:8px; border:1px solid var(--line);
       background:var(--panel); color:var(--ink); cursor:pointer; text-decoration:none; white-space:nowrap;}
  .btn:hover{background:#eef2ff; border-color:var(--accent); color:var(--accent);}
  .btn.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.ar{padding:7px 8px; font-size:11px;}
  .btn[disabled]{opacity:.4; cursor:not-allowed;}
  .btn.go{background:var(--ok); border-color:var(--ok); color:#fff;}
  .btn.stop{background:var(--no); border-color:var(--no); color:#fff;}
  .btn.go:hover,.btn.stop:hover{filter:brightness(.92); color:#fff;}
  select,.inp{font:700 13px var(--font); padding:6px 8px; border:1px solid var(--line); border-radius:8px;
              background:var(--panel); color:var(--ink); min-width:0;}
  select:focus,.inp:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px #3e63dd22;}

  /* 위 1줄: 날짜 · 수업 · 상태 목록 · 메뉴 */
  .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:6px; font-size:16px; font-weight:800; white-space:nowrap;}
  .wifi{width:10px; height:10px; border-radius:50%; background:var(--ok); display:inline-block;}
  .wifi.off{background:var(--no);}
  .grp{display:flex; align-items:center; gap:4px;}
  #dayPick{width:34px; padding:6px 4px; color:transparent;}
  #dayPick::-webkit-datetime-edit{display:none;}
  #blkSel{max-width:250px;}
  .sp{flex:1;}
  .stats{display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  .stats > span{display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800; color:var(--k,#475569);
              padding:4px 9px; border-radius:99px; white-space:nowrap; background:var(--kb,#fff); border:1px solid var(--kd,#e2e8f0);}
  .stats > span b{font-size:15px; font-variant-numeric:tabular-nums;}
  .stats i{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .more{position:relative;}
  .more summary{list-style:none; cursor:pointer;}
  .more summary::-webkit-details-marker{display:none;}
  .more .menu{position:absolute; right:0; top:calc(100% + 6px); z-index:20; background:var(--panel);
              border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column;
              gap:8px; min-width:190px; box-shadow:0 10px 30px rgba(29,36,51,.15);}
  .more .menu label{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; font-weight:700;}
  .more .menu input{width:64px; text-align:center;}

  /* 위 2줄: 수업 시작·종료 + 불러오기 */
  .ctrl{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .classbar,.callbar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:5px 8px;
                     background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 3px rgba(15,23,42,.06);}
  .classbar.idle{border-color:#c7d2fe; background:linear-gradient(90deg,#eef2ff,#f5f7ff);}
  .classbar .runon{font-size:14px; font-weight:800; color:var(--ok); white-space:nowrap;}
  .classbar .lab{font-size:12.5px; font-weight:700; color:var(--sub); white-space:nowrap;}
  .classbar .msg{font-size:12px; font-weight:700;}
  .callbar{background:linear-gradient(90deg,#fff7ed,#fffbeb); border-color:#fcd9a8; flex:1;}
  .callbar.locked{background:#fdecec; border-color:#f3a5a5;}
  .callbar .callt{font-size:14px; font-weight:800; color:#b45309; white-space:nowrap;}
  .callbar #goSel{max-width:210px;}
  .callbar #goTo{width:96px;}
  .callbar .lockck{display:flex; align-items:center; gap:4px; font-size:13px; font-weight:800; color:#7c2d12; cursor:pointer; white-space:nowrap;}
  .callbar .note{font-size:12px; font-weight:700; color:#7c2d12; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1;}
  .callbar .btn.lockoff{background:#e5484d; border-color:#e5484d; color:#fff;}

  /* 학생 칸: 남은 화면을 꽉 채운다(칸 수·글자 크기는 fitGrid 가 정한다) */
  #wrap{flex:1; min-height:0; position:relative;}
  .grid{display:grid; gap:var(--gap,6px); width:100%; height:100%;}
  .s{--c:#94a3b8; --c2:#f8fafc; --bd:#e2e8f0;
     position:relative; border:1px solid var(--bd); border-left:4px solid var(--c); border-radius:10px;
     padding:calc(var(--cf)*.4) calc(var(--cf)*.5) calc(var(--cf)*.35) calc(var(--cf)*.55);
     background:linear-gradient(160deg,#fff 0%,var(--c2) 100%); display:flex; flex-direction:column; gap:.18em;
     min-width:0; min-height:0; overflow:hidden; font-size:var(--cf,12px); line-height:1.32;
     box-shadow:0 1px 2px rgba(15,23,42,.05); transition:background .3s,border-color .3s;}
  .s .hd{display:flex; align-items:center; gap:.4em; min-width:0; flex:none;}
  .s .pg,.s .tb,.s .okl,.s .ft,.s .bar{flex:none;}
  .s .no{font-size:1.75em; font-weight:900; line-height:1; color:var(--c); font-variant-numeric:tabular-nums;}
  .s .chip{font-size:.82em; font-weight:800; padding:.12em .55em; border-radius:99px; background:var(--c); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .s .call{margin-left:auto; font-size:.78em; font-weight:900; color:#b91c1c; background:#fee2e2; border-radius:99px; padding:.1em .45em; white-space:nowrap;}
  .s .pg{font-weight:800; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .s .tb{font-size:.9em; font-weight:700; color:#334155; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .s .okl{font-size:.88em; font-weight:700; color:#15803d; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .s .okl em{font-style:normal; color:#64748b; font-weight:600;}
  .s .mut{color:#94a3b8 !important; font-weight:600;}
  .s .ft{margin-top:auto; display:flex; gap:.3em; flex-wrap:wrap; overflow:hidden; max-height:1.5em;}
  .s .ft span{font-size:.82em; font-weight:800; color:#475569; background:rgba(148,163,184,.16); border-radius:6px; padding:.05em .4em; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .s .ft span.sc{color:#a16207; background:#fef3c7;}
  .s .ft span.warn{color:#b91c1c; background:#fee2e2;}
  .s .bar{display:flex; gap:1px; height:max(4px,calc(var(--cf)*.38)); border-radius:3px; overflow:hidden; margin-top:.1em;}
  .s .bar i{flex:1; background:#e2e8f0;}
  .s .bar i.g{background:#22c55e;} .s .bar i.o{background:#f59e0b;} .s .bar i.n{background:#cbd5e1;} .s .bar i.x{background:transparent;}
  .s.on  {--c:#16a34a; --c2:#e9f9ef; --bd:#bbe7cb;}
  .s.away{--c:#ea8a00; --c2:#fff4e0; --bd:#f7d59a;}
  .s.gone{--c:#e11d48; --c2:#ffe9ee; --bd:#f8bccb;}
  .s.did {--c:#4f46e5; --c2:#eef0ff; --bd:#c9ccfb;}
  .s.off {--c:#94a3b8; --c2:#f1f5f9; --bd:#cbd5e1; border-style:dashed; border-left-style:solid; background:repeating-linear-gradient(135deg,#f8fafc 0 10px,#f1f5f9 10px 20px);}
  .s.off .chip{background:#e2e8f0; color:#64748b;}
  .s.off .no{color:#94a3b8;}
  .s .offm{font-size:.86em; color:#94a3b8; font-weight:700; margin-top:auto;}
  .s.nothere{box-shadow:0 0 0 2px #fca5a5 inset, 0 1px 2px rgba(15,23,42,.05);}
  .s .log{flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:.08em; margin-top:.15em;
          border-top:1px dashed rgba(148,163,184,.45); padding-top:.2em;
          -webkit-mask-image:linear-gradient(#000 calc(100% - 1.1em),transparent); mask-image:linear-gradient(#000 calc(100% - 1.1em),transparent);}
  .s .lg{flex:none; line-height:1.3; font-size:.84em; font-weight:600; color:#475569; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .s .lg b{font-weight:800; color:#94a3b8; font-variant-numeric:tabular-nums;}
  .s .lg.ok{color:#15803d;} .s .lg.hide{color:#b45309;} .s .lg.score{color:#a16207;} .s .lg.go,.s .lg.lock{color:#b91c1c;}
  /* 칸이 작으면 덜 중요한 줄부터 숨긴다 : 최근 기록 → 활동 탭 → 마지막 정답 → 활동 띠·숫자 */
  .grid.r7 .s .log{display:none;}
  .grid.r6 .s .log{display:none;}
  .grid.r5 .s .log,.grid.r5 .s .tb,.grid.r5 .s .okl{display:none;}
  .grid.r4 .s .log,.grid.r4 .s .tb,.grid.r4 .s .okl,.grid.r4 .s .bar{display:none;}
  .grid.r3 .s .log,.grid.r3 .s .tb,.grid.r3 .s .okl,.grid.r3 .s .bar,.grid.r3 .s .ft{display:none;}
  .grid.r3 .s .offm{display:none;}
  .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
         padding:20px; font-size:15px; color:var(--sub); line-height:1.7; background:var(--panel);
         border:1px solid var(--line); border-radius:14px;}
  @media (max-width:640px){
    #app{padding:6px 6px 8px; gap:5px;}
    .top,.ctrl{gap:4px;}
    .brand .t,.brand .ic,#bToday,.top .sp,.callbar .callt .tx,.callbar .note,.classbar .lab{display:none;}
    #daySel{max-width:118px;} #blkSel{max-width:150px;} .callbar #goSel{max-width:132px;} .callbar #goTo{width:70px;}
    .stats{padding:2px;} .stats span{padding:2px 4px; font-size:11.5px;} .stats span .lt{display:none;}
    .classbar,.callbar{padding:4px 5px; gap:4px;} .callbar{flex-basis:100%;}
    .btn{padding:6px 7px;} select,.inp{padding:5px 6px;}
  }

  /* 로그인 화면 */
  #gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center;
        justify-content:center; padding:20px; z-index:50;}
  #gate .box{background:var(--panel); border:1px solid var(--line); border-radius:16px;
             padding:28px 26px; width:min(400px,94vw); text-align:center;
             box-shadow:0 12px 40px rgba(29,36,51,.10);}
  #gate h2{font-size:18px; font-weight:800; margin-bottom:8px;}
  #gate p{font-size:13px; color:var(--sub); line-height:1.65; margin-bottom:18px;}
  #gate .btn{font-size:14px; padding:11px 20px;}
  #gate .err{font-size:12.5px; color:var(--no); font-weight:700; margin-top:12px; min-height:18px;}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>📊 수학 콘텐츠 학습 현황판</h2>
    <p>선생님 구글 계정으로 로그인해야 열립니다.<br>학생 기록은 로그인 전에는 내려오지 않습니다.</p>
    <button class="btn on" id="bLogin">구글 계정으로 로그인</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
<div class="top">
  <div class="brand" title="실시간 연결 상태(초록=이어짐)"><span class="wifi" id="wifi"></span><span class="ic">📊</span> <span class="t">학습 현황판</span></div>
  <div class="grp">
    <button class="btn ar" id="bPrev" title="하루 앞으로">&#9664;</button>
    <select id="daySel" title="기록이 있는 날"></select>
    <input type="date" id="dayPick" class="inp" title="달력에서 다른 날 고르기">
    <button class="btn ar" id="bNext" title="하루 뒤로">&#9654;</button>
    <button class="btn" id="bToday">오늘</button>
  </div>
  <select id="blkSel" title="볼 수업"></select>
  <div class="stats" id="stats"></div>
  <div class="sp"></div>
  <details class="more" id="more"><summary class="btn">⋯</summary>
    <div class="menu">
      <label>표시할 번호 수 <input id="cap" class="inp" type="number" min="1" max="45" value="30"></label>
      <button class="btn" id="bClean">🧹 오래된 기록 정리</button>
      <button class="btn" id="bOut">로그아웃</button>
    </div>
  </details>
</div>
<div class="ctrl">
  <div class="classbar" id="classbar" style="display:none"></div>
  <div class="callbar" id="callbar" style="display:none"></div>
</div>
<div id="wrap"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, onValue, onChildAdded, query, limitToLast, update, remove, set, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

/* ===========================================================
   설정 — 교실에서 쓰는 파이어베이스 프로젝트의 값을 넣는다.
   (콘솔 › 프로젝트 설정 › 내 앱 › firebaseConfig 에서 그대로 옮긴다)
   =========================================================== */
const CFG = {
  apiKey:       "AIzaSyAk7A11wjMPzvOpgPZZbsDlsypcOX7764k",
  authDomain:   "math-learning-log.firebaseapp.com",
  databaseURL:  "https://math-learning-log-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:    "math-learning-log"
};
const TEACHER = "j333333766@gmail.com";     /* 이 계정만 열 수 있다(보안 규칙과 같아야 한다) */

/* 학생 신호(beat)는 25초마다 온다. 90초면 세 번을 내리 놓친 것이라
   한두 번 빠뜨린 것과 확실히 구분된다. 예전 3분은 너무 길어서
   창을 닫은 학생이 한참 초록으로 남아 있었다. */
const GONE_MS = 90000;

const app  = initializeApp(CFG);
const auth = getAuth(app);
const db   = getDatabase(app);

/* ---------- 콘텐츠 파일이름 → 보여 줄 이름 ---------- */
const NAMES = {
  "index":                  "목차",
  "01-pixel-zoom":          "픽셀 돋보기",
  "02-point-line-plane":    "점·선·면 탐구실",
  "03-angle-lab":           "각도 실험실",
  "04-perp-foot":           "수선의 발과 거리",
  "05-plane-position":      "평면 위의 위치 관계",
  "05-space-3d":            "공간에서의 위치 관계",
  "06-mole-game":           "두더지 잡기",
  "07-parallel-angles":     "평행선 각 탐구실",
  "08-aux-line":            "보조선 도전",
  "09-illusion":            "착시 실험실",
  "10-construction":        "가상 작도판",
  "11-triangle-condition":  "삼각형 결정 조건",
  "12-congruence":          "합동 포개기",
  "13-egg-puzzle":          "에그 퍼즐",
  "14-truss":               "흔들리지 않는 삼각형",

  "ch5-01-diagonals":       "대각선 탐험대",
  "ch5-02-exterior-angle":  "삼각형 외각 실험실",
  "ch5-03-interior-sum":    "내각의 합 조립실",
  "ch5-04-exterior-sum":    "외각 360° 모으기",
  "ch5-05-circle-parts":    "원의 부분 이름 찾기",
  "ch5-06-central-angle":   "중심각과 호 실험실",
  "ch5-07-sector-size":     "부채꼴 호·넓이 계산기",
  "ch5-08-polyhedron":      "다면체 탐구실",
  "ch5-09-revolution":      "회전체 만들기",
  "ch5-10-prism":           "기둥 펼치기",
  "ch5-11-pyramid":         "뿔 실험실",
  "ch5-12-sphere":          "구 실험실"
};

const AUTO_END_MS = 3 * 3600 * 1000;   /* 종료를 깜빡해도 3시간 지나면 끝난 것으로 본다 */

/* ---------- 받아 둔 것 ---------- */
let SESS = {};          /* 수업 : ms -> {ms,g,c,end} */
let CUR  = null;        /* 지금 열린 수업 {ms,g,c} */
let EV   = {};          /* 기록 : ms -> [ {t,n,k,p,d,v,sc} ... ] */
let SCORES = [];        /* 점수 : [{t,g,c,n,p,sc}] */
let LEARNED = {};       /* 이름표에 없는 콘텐츠의 이름 */
let OFF = 0;            /* 서버 시계와의 차이 — 교사 컴퓨터 시계가 틀려도 정확하게 */
let SUBS = {};          /* 붙여 둔 실시간 구독 : ms -> 끊는 함수 */
let PENDING_NAMES = {};

const $ = (id) => document.getElementById(id);
const serverNow = () => Date.now() + OFF;
const nameOf = (p) => NAMES[p] || LEARNED[p] || p;

/* ---------- 로그인 ---------- */
$("bLogin").onclick = async () => {
  $("gateErr").textContent = "";
  try{
    await signInWithPopup(auth, new GoogleAuthProvider());
  }catch(err){
    $("gateErr").textContent = "로그인하지 못했습니다 — " + (err && err.code ? err.code : err);
  }
};
$("bOut").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if(!user){
    $("gate").style.display = "flex";
    $("app").style.display = "none";
    return;
  }
  if(user.email !== TEACHER){
    $("gateErr").textContent = user.email + " 계정으로는 열 수 없습니다.";
    signOut(auth);
    return;
  }
  $("gate").style.display = "none";
  $("app").style.display = "flex";
  listen();
});

/* ---------- 실시간으로 받아 오기 ---------- */
let started = false;
function listen(){
  if(started) return;
  started = true;

  onValue(ref(db, ".info/serverTimeOffset"), (s) => { OFF = Number(s.val()) || 0; });
  onValue(ref(db, ".info/connected"), (s) => {
    const on = !!s.val();
    $("wifi").className = "wifi" + (on ? "" : " off");
    $("wifi").title = on ? "실시간 연결: 이어짐" : "실시간 연결: 끊김";
  });

  onValue(ref(db, "mk/sessions"), (s) => {
    SESS = s.val() || {};
    syncSubs();
    draw();
  });
  onValue(ref(db, "mk/current"), (s) => {
    const v = s.val();
    CUR = (v && v.ms) ? {ms:Number(v.ms), g:Number(v.g)||0, c:Number(v.c)||0} : null;
    GO = (v && v.go) ? v.go : null;
    syncSubs();
    draw();
    paintCallbar();
  });
  onValue(ref(db, "mk/names"), (s) => { LEARNED = s.val() || {}; draw(); });

  /* 점수는 역대 최고를 뽑아야 하므로 최근 것만 넉넉히 받아 둔다 */
  /* 옛 구글 시트 기록을 가져오면서 점수가 4800개를 넘었다. 4000이면 오래된 것이
     잘려 '역대 최고'가 달라진다. 가져온 점수의 키는 '!'로 시작해(파이어베이스
     푸시키의 '-'보다 앞선다) 시간순으로 줄 서므로, 한도만 넉넉히 올리면 된다. */
  onChildAdded(query(ref(db, "mk/scores"), limitToLast(20000)), (s) => {
    const v = s.val() || {};
    SCORES.push({t:Number(v.st)||0, g:Number(v.g)||0, c:Number(v.c)||0,
                 n:Number(v.n)||0, p:String(v.p||""), sc:Number(v.sc)||0});
    draw();
  });
}

/* 보고 있는 날짜의 수업들과 진행 중인 수업만 구독한다 */
function syncSubs(){
  const want = {};
  for(const ms of dayList(DAY)) want[ms] = true;
  if(CUR) want[CUR.ms] = true;

  for(const ms of Object.keys(SUBS)){
    if(!want[ms]){ SUBS[ms](); delete SUBS[ms]; }
  }
  for(const ms of Object.keys(want)){
    if(SUBS[ms]) continue;
    EV[ms] = EV[ms] || [];
    SUBS[ms] = onChildAdded(ref(db, "mk/ev/" + ms), (s) => { addBatch(ms, s.val()); draw(); });
  }
}

/* 학생이 한 번에 밀어 넣은 묶음을 이벤트 낱개로 편다.
   시각은 서버가 찍은 st 에 묶음 안 상대 간격(o)을 더해 되살린다. */
function addBatch(ms, b){
  if(!b || !b.e) return;
  const st = Number(b.st) || 0;
  const n  = Number(b.n) || 0;
  const list = Array.isArray(b.e) ? b.e : Object.keys(b.e).map((k) => b.e[k]);
  const arr = EV[ms] || (EV[ms] = []);
  for(const e of list){
    if(!e) continue;
    const p = String(e.p || "");
    arr.push({t: st + (Number(e.o) || 0), n, k:String(e.k||""), p,
              d:String(e.d||""), v: e.v ? 1 : 0,
              sc: (typeof e.sc === "number") ? e.sc : undefined});
    if(e.k === "open") learn(p, String(e.d || ""));
  }
}

/* 이름표에 없는 콘텐츠는 학생 화면이 보내 준 제목에서 배운다 */
function learn(page, title){
  if(!page || !title || NAMES[page] || LEARNED[page] || PENDING_NAMES[page]) return;
  const short = title.split("—")[0].split("–")[0].trim().slice(0, 40);
  if(!short || short === page) return;
  PENDING_NAMES[page] = short;
  update(ref(db, "mk/names"), {[page]: short}).catch(() => {});
}

/* ---------- 날짜·수업 고르기 ---------- */
/* DAY 는 '보고 있는 날짜의 0시'(ms). 달력에서 아무 날이나 고를 수 있다. */
const DAY_MS = 24*3600*1000;
const WEEK = ["일","월","화","수","목","금","토"];

function startOfDay(ms){ const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function today(){ return startOfDay(Date.now()); }
function isToday(){ return DAY === today(); }
function ymdStr(ms){
  const d = new Date(ms);
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
function mdw(ms){
  const d = new Date(ms);
  return (d.getMonth()+1) + "/" + d.getDate() + "(" + WEEK[d.getDay()] + ")";
}

let DAY = today(), BLK = null;

function dayRange(d){ return [d, d + DAY_MS]; }
function dayList(d){
  const [lo, hi] = dayRange(d);
  return Object.keys(SESS).map(Number).filter((ms) => ms >= lo && ms < hi).sort((a,b) => a-b);
}
function activeSession(){
  if(!CUR) return null;
  const s = SESS[CUR.ms];
  if(s && s.end) return null;
  if(serverNow() - CUR.ms > AUTO_END_MS) return null;   /* 종료를 깜빡한 수업 */
  return {ms:CUR.ms, g:CUR.g, c:CUR.c};
}

/* ---------- 집계 : Apps Script 의 getState() 를 그대로 옮긴 것 ---------- */
function build(){
  const now = serverNow();
  const [dayStart, dayEnd] = dayRange(DAY);
  const act = activeSession();

  const blocks = dayList(DAY).map((ms) => {
    const s = SESS[ms] || {};
    return {from:ms, to:(Number(s.end) || Math.min(now, dayEnd)),
            g:Number(s.g)||0, c:Number(s.c)||0, n:0, open: !!(act && act.ms === ms)};
  });

  /* 수업별 참여 인원 */
  blocks.forEach((b) => {
    const seen = {};
    for(const e of (EV[b.from] || [])) if(e.t >= b.from && e.t <= b.to) seen[e.n] = true;
    b.n = Object.keys(seen).length;
  });

  /* 볼 구간 고르기 */
  let sel;
  if(BLK === null){
    sel = -1;
    blocks.forEach((b, i) => { if(b.open) sel = i; });
    if(sel < 0 && blocks.length) sel = blocks.length - 1;
  }else sel = Number(BLK);
  if(!(sel >= 0 && sel < blocks.length)) sel = -1;          /* -1 = 하루 전체 */

  const lo = sel < 0 ? dayStart : blocks[sel].from;
  const hi = sel < 0 ? dayEnd   : blocks[sel].to + 1;

  /* 그 구간의 학생·콘텐츠 집계 */
  const stu = {}, pageCnt = {};
  let total = 0;
  for(const ms of (sel < 0 ? dayList(DAY) : [blocks[sel].from])){
    const s = SESS[ms] || {};
    for(const e of (EV[ms] || [])){
      if(e.t < lo || e.t >= hi) continue;
      total++;
      const key = (s.g||0) + "-" + (s.c||0) + "-" + e.n;
      let a = stu[key];
      if(!a) a = stu[key] = {n:e.n, first:e.t, last:0, page:"", vis:1, ok:0, pages:{}, hidden:0, list:[]};
      a.list.push(e);
      if(e.t < a.first) a.first = e.t;
      if(e.t >= a.last){ a.last = e.t; a.vis = e.v; if(e.p) a.page = e.p; }
      if(e.p){
        a.pages[e.p] = true;
        if(!pageCnt[e.p]) pageCnt[e.p] = {visit:{}, ok:0};
        pageCnt[e.p].visit[key] = true;
      }
      if(e.k === "ok"){ a.ok++; if(e.p && pageCnt[e.p]) pageCnt[e.p].ok++; }
      if(e.k === "hide") a.hidden++;
    }
  }

  const students = Object.keys(stu).map((k) => {
    const a = stu[k];
    a.pageCount = Object.keys(a.pages).length;
    detail(a, now, lo);
    a.pageName  = nameOf(a.page);
    a.span = Math.max(0, a.last - a.first);
    delete a.pages;
    return a;
  }).sort((x,y) => x.n - y.n);

  const pages = Object.keys(pageCnt).map((p) => ({
    page:p, name:nameOf(p), visit:Object.keys(pageCnt[p].visit).length, ok:pageCnt[p].ok
  })).sort((a,b) => b.visit - a.visit);

  /* 점수 */
  const mine = {}, bestBy = {};
  for(const r of SCORES){
    if(r.t >= lo && r.t < hi){
      if(!(r.n in mine) || r.sc > mine[r.n]) mine[r.n] = r.sc;
    }
    const b = bestBy[r.p];
    if(!b || r.sc > b.sc) bestBy[r.p] = r;
  }
  students.forEach((a) => { if(a.n in mine) a.score = mine[a.n]; });

  const best = Object.keys(bestBy).map((p) => {
    const r = bestBy[p];
    return {page:p, name:nameOf(p), score:r.sc, g:r.g, c:r.c, n:r.n, ms:r.t};
  }).sort((a,b) => b.score - a.score);

  const rank = Object.keys(mine).map((k) => ({n:Number(k), score:mine[k]}))
    .sort((a,b) => b.score - a.score);

  return {
    now, students, blocks, sel,
    live: sel >= 0 && blocks[sel].open,
    from: sel < 0 ? dayStart : blocks[sel].from,
    to:   sel < 0 ? Math.min(now, dayEnd) : blocks[sel].to,
    g: sel < 0 ? 0 : blocks[sel].g,
    c: sel < 0 ? 0 : blocks[sel].c,
    startMs: sel < 0 ? 0 : blocks[sel].from,
    running: act ? {from:act.ms, g:act.g, c:act.c} : null,
    pages, best, rank, total
  };
}

/* 학생 한 명의 자세한 실시간 값 — 이미 받는 기록(open·beat·tab·ok·hide·show·score)에서 계산한다 */
const BIN_MS = 30000, BINS = 20;            /* 활동 띠: 30초 × 20칸 = 최근 10분 */
function detail(a, now, lo){
  const L = a.list.sort((x, y) => x.t - y.t); delete a.list;
  const last = L[L.length - 1] || {};
  /* 지금 콘텐츠에 들어온 때 : 뒤에서부터 같은 콘텐츠가 이어지는 동안 */
  let since = last.t || now;
  for(let i = L.length - 1; i >= 0; i--){ if(L[i].p && L[i].p !== a.page) break; since = L[i].t; }
  a.pageSince = since;
  /* 지금 상태(보는 중/다른 탭)가 이어진 시간 */
  let vsince = last.t || now;
  for(let i = L.length - 1; i >= 0; i--){ if(L[i].v !== a.vis) break; vsince = L[i].t; }
  a.visSince = vsince;
  a.tab = ""; a.lastOk = null; a.okPage = 0; a.lastAct = 0;
  for(const e of L){
    if(e.k !== "beat" && e.k !== "show" && e.k !== "hide") a.lastAct = e.t;
    if(e.t < since || (e.p && e.p !== a.page)) continue;
    if(e.k === "tab" && e.d) a.tab = e.d;
    if(e.k === "open") a.tab = "";
    if(e.k === "ok"){ a.okPage++; a.lastOk = {t:e.t, d:e.d}; }
  }
  /* 최근 10분 활동 띠 : 칸마다 그 칸의 마지막 신호로 색을 정하고, 신호가 없으면 앞 칸 상태를 60초까지 이어 간다 */
  const bins = [], start = now - BIN_MS * BINS;
  let j = 0, cur = null, curT = 0;
  while(j < L.length && L[j].t < start){ cur = L[j].v; curT = L[j].t; j++; }
  for(let b = 0; b < BINS; b++){
    const end = start + (b + 1) * BIN_MS;
    let seen = false;
    while(j < L.length && L[j].t < end){ cur = L[j].v; curT = L[j].t; seen = true; if(L[j].k === "bye") cur = null; j++; }
    const binStart = end - BIN_MS;
    bins.push(binStart < lo ? "x" : (cur === null || (!seen && end - curT > 60000)) ? "n" : cur ? "g" : "o");
  }
  a.bins = bins.join("");
  /* 최근 활동 기록(신호·화면 전환 말고 학생이 한 일 위주, 최근 것부터) */
  a.recent = L.filter((e) => e.k !== "beat").slice(-6).reverse();
}

/* ---------- 그리기 (예전 현황판과 같은 화면) ---------- */
let DATA = null;
function cap(){ return Math.max(1, Math.min(45, Number($("cap").value) || 30)); }
function ago(ms){
  const s = Math.round(ms/1000);
  if(s < 60) return s + "초 전";
  const m = Math.floor(s/60);
  if(m < 60) return m + "분 전";
  return Math.floor(m/60) + "시간 전";
}
function hhmm(ms){
  const d = new Date(ms);
  return ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
}
function mins(ms){ return Math.max(1, Math.round(ms/60000)) + "분"; }
function className(g, c){ return c ? ((g ? g + "-" : "") + c + "반") : ""; }

/* 데이터가 쏟아질 때 화면을 너무 자주 다시 그리지 않도록 잠깐 모아서 그린다 */
let drawTimer = 0;
function draw(){
  if(drawTimer) return;
  drawTimer = setTimeout(() => { drawTimer = 0; render(); }, 250);
}
function render(){
  DATA = build();
  paintDaybar();
  paintBlocks();
  paintClassbar();
  paint();
}

function paintBlocks(){
  const b = DATA.blocks;
  let html = "";
  b.forEach((x, i) => {
    const live = x.open && isToday();
    const time = hhmm(x.from) + "~" + hhmm(x.to);
    html += '<option value="' + i + '">' + (live ? "● " : "") + (x.c ? className(x.g, x.c) + " " : "") + time + " · " + x.n + "명</option>";
  });
  html += '<option value="-1">하루 전체</option>';
  const sel = $("blkSel");
  if(sel.innerHTML !== html) sel.innerHTML = html;
  sel.value = String(DATA.sel);
  sel.disabled = !b.length;
}
$("blkSel").onchange = () => { BLK = Number($("blkSel").value); render(); };

/* ---------- 수업 시작 / 종료 ---------- */
let PICK_G = 1, PICK_C = 0, EDIT = false, BUSY = false, SAYMSG = null, BARSIG = "";
try{ PICK_G = Number(localStorage.getItem("dash.grade")) || 1; }catch(e){}

function pickerHtml(selG, selC){
  let gh = "", ch = '<option value="0">반</option>';
  for(let g=1;g<=3;g++) gh += '<option value="' + g + '"' + (selG === g ? " selected" : "") + '>' + g + '학년</option>';
  for(let c=1;c<=12;c++) ch += '<option value="' + c + '"' + (selC === c ? " selected" : "") + '>' + c + '반</option>';
  return '<select id="pickG">' + gh + '</select><select id="pickC">' + ch + '</select>';
}

function paintClassbar(force){
  const bar = $("classbar");
  if(!DATA){ bar.style.display = "none"; BARSIG = ""; return; }
  bar.style.display = "flex";

  const run = DATA.running;
  const pastSel = (DATA.sel >= 0 && !(run && DATA.startMs === run.from)) ? DATA.sel : -1;

  const sig = [run && run.from, run && run.g, run && run.c,
               DATA.sel, DATA.g, DATA.c, PICK_G, PICK_C, EDIT, BUSY,
               SAYMSG && SAYMSG.t].join("|");
  if(!force && sig === BARSIG) return;
  BARSIG = sig;

  let html;
  if(run){
    html = '<span class="runon">● ' + className(run.g, run.c) + ' 수업 중</span>' +
           '<span class="lab">' + hhmm(run.from) + ' · <span id="runMin">0분</span>째</span>' +
           '<button class="btn stop" id="btnEnd" title="수업을 닫으면 학생 기록이 더 저장되지 않습니다">■ 종료</button>';
  }else if(pastSel >= 0 && !EDIT){
    html = '<span class="lab">' + hhmm(DATA.from) + "~" + hhmm(DATA.to) + " " + (DATA.c ? className(DATA.g, DATA.c) : "반 없음") + '</span>' +
           '<button class="btn" id="btnEdit">반 고치기</button>' +
           pickerHtml(PICK_G, PICK_C) +
           '<button class="btn go" id="btnStart"' + (PICK_C ? "" : " disabled") + ' title="시작을 눌러야 학생 기록이 저장됩니다">▶ 새 수업 시작</button>';
  }else if(EDIT){
    html = '<span class="lab">' + hhmm(DATA.from) + "~" + hhmm(DATA.to) + ' 수업을</span>' + pickerHtml(PICK_G, PICK_C) +
           '<button class="btn go" id="btnRename"' + (PICK_C ? "" : " disabled") + '>로 고치기</button>' +
           '<button class="btn" id="btnCancel">취소</button>';
  }else{
    html = pickerHtml(PICK_G, PICK_C) +
           '<button class="btn go" id="btnStart"' + (PICK_C ? "" : " disabled") + ' title="시작을 눌러야 학생 기록이 저장됩니다">▶ 수업 시작</button>';
  }
  bar.innerHTML = html;
  bar.style.opacity = BUSY ? ".55" : "1";

  if(SAYMSG){
    const e = document.createElement("span");
    e.className = "msg";
    e.style.color = SAYMSG.bad ? "#e5484d" : "#2f9e63";
    e.textContent = SAYMSG.t;
    bar.appendChild(e);
  }
}

async function ask(fn, msg){
  BUSY = true; SAYMSG = {t:msg, bad:false};
  paintClassbar(true);
  try{
    await fn();
    SAYMSG = null; BLK = null;
  }catch(err){
    SAYMSG = {t:"실패: " + (err && err.message ? err.message : err), bad:true};
  }
  BUSY = false;
  render();
  paintClassbar(true);
}

/* ---------- 📣 불러오기 : 고른 콘텐츠로 접속한 학생 화면을 옮긴다 ----------
   /mk/current/go 에 {id, href, name, t, to} 를 쓴다. 학생 track.js 가 실시간으로 듣고 옮겨 간다.
   수업이 열려 있을 때만 보인다. 수업을 닫거나 새로 열면 지시도 사라진다. */
let GO = null, CALLSIG = "";
function contentHref(slug){ return slug === "index" ? "index.html" : slug === "unit4" ? "index.html?unit=4" : "contents/" + slug + ".html"; }
function paintCallbar(){
  const bar = $("callbar");
  if(!CUR){ bar.style.display = "none"; CALLSIG = ""; return; }
  bar.style.display = "flex";
  const sig = String(CUR.ms);
  if(sig !== CALLSIG){
    CALLSIG = sig;
    const keys = Object.keys(NAMES).filter(k => k !== "index");
    const og = (lab, ks) => '<optgroup label="' + lab + '">' + ks.map(k => '<option value="' + k + '">' + NAMES[k] + '</option>').join("") + '</optgroup>';
    bar.innerHTML = '<span class="callt">📣<span class="tx"> 불러오기</span></span>' +
      '<select id="goSel"><option value="">콘텐츠 고르기</option>' +
      '<optgroup label="목차"><option value="index">목차 (5단원)</option><option value="unit4">목차 (4단원)</option></optgroup>' +
      og("Ⅳ. 도형의 기초", keys.filter(k => /^\d/.test(k))) + og("Ⅴ. 도형의 성질", keys.filter(k => /^ch5-/.test(k))) + '</select>' +
      '<input id="goTo" class="inp" placeholder="번호(전체)" title="몇 명만 부르려면 번호를 쉼표로(예: 3, 7). 비우면 전체">' +
      '<label class="lockck" title="켜고 불러오면, 잠긴 동안 학생이 사이트 안의 다른 콘텐츠로 가지 못합니다(최대 90분). 다른 사이트·탭은 막을 수 없어 주황으로 보입니다."><input type="checkbox" id="goLock">🔒 잠금</label>' +
      '<button class="btn go" id="goBtn">불러오기</button><span class="note" id="goNote"></span>' +
      '<button class="btn lockoff" id="goUnlock" style="display:none">🔓 풀기</button>' +
      '<button class="btn" id="goClear" title="지시를 지운다(잠금도 풀린다). 늦게 들어오는 학생도 더는 불려 가지 않는다">지우기</button>';
    $("goBtn").onclick = callGo; $("goClear").onclick = clearGo; $("goUnlock").onclick = unlockGo;
  }
  paintGoNote();
}
function paintGoNote(){
  const e = $("goNote"); if(!e) return;
  const ub = $("goUnlock"), locked = !!(GO && GO.lock && serverNow() - Number(GO.t || 0) < 90 * 60000);
  if(ub) ub.style.display = locked ? "" : "none";
  $("callbar").classList.toggle("locked", locked);
  if(!GO || !GO.id){ e.textContent = ""; e.title = "번호를 넣고 접속한 학생 화면이 고른 콘텐츠로 옮겨 갑니다."; return; }
  const min = Math.max(0, Math.round((serverNow() - Number(GO.t || 0)) / 60000));
  const to = GO.to ? Object.values(GO.to).join(", ") + "번" : "전체";
  const page = (GO.href || "").replace(/^contents\//, "").replace(/\.html.*$/, "");
  const there = page ? onPage(page) : 0;
  e.textContent = (locked ? "🔒 " : "→ ") + (GO.name || GO.href) + " · " + to + " · " + (min ? min + "분 전" : "방금") + (page ? " · 여기 " + there + "명" : "");
  e.title = (locked ? "잠금 중: " : "최근 지시: ") + e.textContent;
}
function onPage(page){   /* 지금 수업에서 90초 안에 신호가 온 학생 가운데 마지막으로 이 콘텐츠에 있던 학생 수 */
  const evs = (CUR && EV[CUR.ms]) || [], last = {}, now = serverNow();
  for(const e of evs){ if(!e || !e.n) continue; if(!last[e.n] || e.t >= last[e.n].t) last[e.n] = e; }
  return Object.values(last).filter(e => e.p === page && now - e.t < GONE_MS && e.k !== "bye").length;
}
async function callGo(){
  const slug = $("goSel").value; if(!slug){ $("goNote").textContent = "콘텐츠를 먼저 고르세요."; return; }
  const nums = ($("goTo").value.match(/\d+/g) || []).map(Number).filter(n => n >= 1 && n <= 45);
  const name = slug === "index" ? "목차 (5단원)" : slug === "unit4" ? "목차 (4단원)" : NAMES[slug];
  const go = {id: serverNow().toString(36) + Math.random().toString(36).slice(2, 6), href: contentHref(slug), name, t: serverTimestamp()};
  if(nums.length) go.to = nums;
  if($("goLock").checked) go.lock = true;
  try{ $("goBtn").disabled = true; await set(ref(db, "mk/current/go"), go); }
  catch(err){ $("goNote").textContent = "보내지 못했습니다: " + (err && err.message ? err.message : err); }
  finally{ $("goBtn").disabled = false; }
}
async function clearGo(){ try{ await remove(ref(db, "mk/current/go")); }catch(err){} }
async function unlockGo(){ try{ await update(ref(db, "mk/current/go"), {lock: false}); }catch(err){} }
setInterval(paintGoNote, 5000);

async function startClass(g, c){
  const ms  = serverNow();
  const act = activeSession();
  const up  = {};
  if(act) up["mk/sessions/" + act.ms + "/end"] = ms;      /* 앞 수업 닫기 */
  up["mk/sessions/" + ms] = {ms, g, c, end:0};
  up["mk/current"] = {ms, g, c};
  await update(ref(db), up);
}
async function endClass(){
  const act = activeSession();
  const up = {};
  if(act) up["mk/sessions/" + act.ms + "/end"] = serverNow();
  up["mk/current"] = null;
  await update(ref(db), up);
}
async function renameSession(ms, g, c){
  const up = {};
  up["mk/sessions/" + ms + "/g"] = g;
  up["mk/sessions/" + ms + "/c"] = c;
  if(CUR && CUR.ms === ms) up["mk/current"] = {ms, g, c};
  await update(ref(db), up);
}

$("classbar").addEventListener("change", (ev) => {
  const t = ev.target;
  if(t.id === "pickG"){ PICK_G = Number(t.value) || 1; try{ localStorage.setItem("dash.grade", PICK_G); }catch(e){} paintClassbar(true); }
  if(t.id === "pickC"){ PICK_C = Number(t.value) || 0; paintClassbar(true); }
});
$("classbar").addEventListener("click", (ev) => {
  const b = ev.target && ev.target.closest ? ev.target.closest("button") : null;
  if(!b || !DATA || BUSY || b.disabled) return;

  if(b.hasAttribute("data-g")){
    PICK_G = Number(b.getAttribute("data-g"));
    try{ localStorage.setItem("dash.grade", PICK_G); }catch(e){}
    paintClassbar(true);
    return;
  }
  if(b.hasAttribute("data-c")){
    const c = Number(b.getAttribute("data-c"));
    PICK_C = (c === PICK_C) ? 0 : c;
    paintClassbar(true);
    return;
  }
  if(b.id === "btnStart" && PICK_C){
    EDIT = false;
    ask(() => startClass(PICK_G, PICK_C), "수업을 여는 중…");
    return;
  }
  if(b.id === "btnEnd"){ ask(endClass, "수업을 닫는 중…"); return; }
  if(b.id === "btnEdit"){ EDIT = true; PICK_G = DATA.g || PICK_G; PICK_C = DATA.c || 0; paintClassbar(true); return; }
  if(b.id === "btnCancel"){ EDIT = false; PICK_C = 0; paintClassbar(true); return; }
  if(b.id === "btnRename" && PICK_C){
    const ms = DATA.startMs;
    EDIT = false;
    ask(() => renameSession(ms, PICK_G, PICK_C), "고치는 중…");
    return;
  }
});

function paint(){
  if(!DATA) return;
  $("classbar").className = "classbar" + (DATA.running ? "" : " idle");
  const rm = $("runMin");
  if(rm && DATA.running) rm.textContent = Math.max(0, Math.round((serverNow() - DATA.running.from)/60000)) + "분";

  const N = cap(), live = DATA.live && isToday();
  let on = 0, away = 0, gone = 0, off = 0, did = 0, okAll = 0;
  const byNo = {};
  DATA.students.forEach((a) => { byNo[a.n] = a; okAll += a.ok; });

  const list = [];
  for(let i=1;i<=N;i++) list.push([i, byNo[i]]);
  DATA.students.forEach((a) => { if(a.n > N) list.push([a.n, a]); });

  const goPage = (GO && GO.id && serverNow() - Number(GO.t || 0) < 90 * 60000) ? String(GO.href || "").replace(/^contents\//, "").replace(/\.html.*$/, "") : "";
  const goTo = GO && GO.to ? Object.values(GO.to).map(Number) : null;
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const dur = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + "초" : s < 3600 ? Math.floor(s / 60) + "분" : Math.floor(s / 3600) + "시간"; };
  let cells = "";
  for(const [i, a] of list){
    if(!a){ off++; cells += '<div class="s off" title="' + i + '번 · 미접속"><div class="hd"><span class="no">' + i + '</span><span class="chip">미접속</span></div><div class="offm">아직 들어오지 않았어요</div></div>'; continue; }
    const now = serverNow(), d = now - a.last;
    let cls, tag, extra = "";
    if(!live){ cls = "did"; tag = "참여함"; did++; }
    else if(d > GONE_MS){ cls = "gone"; tag = "끊김"; gone++; extra = dur(d) + " 전"; }
    else if(!a.vis){ cls = "away"; tag = "다른 탭"; away++; extra = dur(now - a.visSince) + "째"; }
    else { cls = "on"; tag = "학습 중"; on++; }
    const pg = a.pageName || "";
    const called = live && goPage && (!goTo || goTo.includes(i));
    const notHere = called && a.page !== goPage;
    const tabTxt = a.tab ? a.tab.replace(/\s+/g, " ") : "";
    const okTxt = a.lastOk ? '✓ ' + esc(a.lastOk.d || "정답·완료").slice(0, 40) + ' <em>' + dur(now - a.lastOk.t) + ' 전</em>' : '<span class="mut">아직 정답·완료 없음</span>';
    const bins = (a.bins || "").split("").map((b) => '<i class="' + b + '"></i>').join("");
    const chips = live
      ? '<span title="이 콘텐츠에 머문 시간">⏱' + dur(now - a.pageSince) + '</span><span title="이 콘텐츠 정답·완료 / 수업 전체">✓' + a.okPage + '/' + a.ok + '</span>' +
        (a.score != null ? '<span class="sc" title="점수">🏅' + a.score + '</span>' : '') +
        '<span title="다른 탭으로 나간 횟수"' + (a.hidden >= 3 ? ' class="warn"' : '') + '>↗' + a.hidden + '</span><span title="연 콘텐츠 수">📄' + a.pageCount + '</span>'
      : '<span title="머문 시간">⏱' + mins(a.span) + '</span><span title="정답·완료">✓' + a.ok + '</span>' + (a.score != null ? '<span class="sc">🏅' + a.score + '</span>' : '') +
        '<span title="다른 탭으로 나간 횟수">↗' + a.hidden + '</span><span title="연 콘텐츠 수">📄' + a.pageCount + '</span>';
    cells += '<div class="s ' + cls + (notHere ? " nothere" : "") + '" title="' + i + '번 · ' + tag + (pg ? " · " + esc(pg) : "") + (tabTxt ? " · " + esc(tabTxt) : "") + '">' +
      '<div class="hd"><span class="no">' + i + '</span><span class="chip">' + tag + (extra ? ' · ' + extra : '') + '</span>' + (notHere ? '<span class="call" title="불러온 콘텐츠로 아직 오지 않았어요">📣 안 옴</span>' : '') + '</div>' +
      '<div class="pg">' + esc(pg) + '</div>' +
      (tabTxt ? '<div class="tb">▸ ' + esc(tabTxt) + '</div>' : '<div class="tb mut">▸ 활동 탭 기록 없음</div>') +
      '<div class="okl">' + okTxt + '</div>' +
      (a.recent && a.recent.length ? '<div class="log">' + a.recent.map((e) => {
        const ic = e.k === "ok" ? "✓" : e.k === "tab" ? "▸" : e.k === "hide" ? "↗" : e.k === "show" ? "↩" : e.k === "open" ? "📄" : e.k === "score" ? "🏅" : e.k === "go" ? "📣" : e.k === "lock" ? "🔒" : e.k === "bye" ? "⏻" : "·";
        const tx = e.k === "ok" ? (e.d || "정답·완료") : e.k === "tab" ? (e.d || "활동 바꿈") : e.k === "hide" ? "다른 탭으로" : e.k === "show" ? "돌아옴" : e.k === "open" ? nameOf(e.p) + " 열기" : e.k === "score" ? (e.sc != null ? e.sc + "점" : "점수") : e.k === "go" ? "불러오기 따라옴" : e.k === "lock" ? "잠금으로 되돌아감" : e.k === "bye" ? "창 닫음" : e.k;
        return '<div class="lg ' + e.k + '"><b>' + hhmm(e.t) + '</b> ' + ic + ' ' + esc(String(tx).slice(0, 34)) + '</div>'; }).join("") + '</div>' : '') +
      '<div class="ft">' + chips + '</div>' +
      (live ? '<div class="bar" title="최근 10분(30초 단위): 초록 화면 봄 · 주황 다른 탭 · 회색 신호 없음">' + bins + '</div>' : '') +
      '</div>';
  }

  const has = DATA.students.length;
  $("wrap").innerHTML = has
    ? '<div class="grid" id="grid">' + cells + '</div>'
    : '<div class="empty">' + (
        !isToday() ? mdw(DAY) + "에는 기록이 없습니다.<br>위 날짜 목록이나 달력에서 다른 날을 고르세요."
        : DATA.running ? "아직 접속한 학생이 없습니다.<br>학생이 콘텐츠를 열면 여기에 나타납니다."
        : "수업이 시작되지 않았습니다.<br>위에서 학년·반을 고르고 <b>▶ 수업 시작</b>을 눌러 주세요. 시작한 뒤의 기록만 저장됩니다.") + '</div>';
  if(has) fitGrid(list.length);

  const st = live
    ? [["#2f9e63","학습 중",on,"화면을 보고 있음(90초 이내)"],["#f5820b","다른 탭",away,"페이지는 열려 있으나 다른 탭·창을 보는 중"],["#e5484d","끊김",gone,"90초 넘게 신호 없음(창을 닫았거나 자리 비움)"],["#9aa5b8","미접속",off,"접속 기록 없음"]]
    : [["#3e63dd","참여함",did,"이 수업에 참여함(지난 수업은 실시간 색 대신 참여·머문 시간)"],["#9aa5b8","미접속",off,"접속 기록 없음"]];
  const SOFT = {"#2f9e63":["#15803d","#e9f9ef","#bbe7cb"],"#f5820b":["#b45309","#fff4e0","#f7d59a"],"#e5484d":["#be123c","#ffe9ee","#f8bccb"],"#9aa5b8":["#64748b","#f1f5f9","#cbd5e1"],"#3e63dd":["#4338ca","#eef0ff","#c9ccfb"]};
  $("stats").innerHTML = st.map(x => { const c = SOFT[x[0]] || []; return '<span title="' + x[3] + '" style="--k:' + c[0] + ';--kb:' + c[1] + ';--kd:' + c[2] + '"><i style="background:' + x[0] + '"></i><span class="lt">' + x[1] + '</span><b>' + (has ? x[2] : 0) + '</b></span>'; }).join("") +
    '<span title="정답·완료 신호(누적)" style="--k:#0f766e;--kb:#e6f7f5;--kd:#a7e3dc">✓<span class="lt">잘함</span><b>' + okAll + '</b></span>';
}

/* 학생 칸이 #wrap 을 꽉 채우도록 줄·칸 수와 글자 크기를 정한다(스크롤이 생기지 않게) */
function fitGrid(n){
  const w = $("wrap"), g = $("grid"); if(!g) return;
  const W = w.clientWidth, H = w.clientHeight, gap = W < 600 ? 4 : 6;
  let best = null;
  for(let cols=1; cols<=n; cols++){
    const rows = Math.ceil(n / cols);
    const cw = (W - gap*(cols-1)) / cols, ch = (H - gap*(rows-1)) / rows;
    if(cw <= 0 || ch <= 0) continue;
    const score = Math.min(cw / 1.35, ch);      /* 가로가 조금 긴 칸이 읽기 좋다 */
    if(!best || score > best.score) best = {cols, rows, cw, ch, score};
  }
  if(!best) return;
  g.style.setProperty("--gap", gap + "px");
  g.style.gridTemplateColumns = "repeat(" + best.cols + ", minmax(0,1fr))";
  g.style.gridTemplateRows = "repeat(" + best.rows + ", minmax(0,1fr))";
  const cf = Math.max(9, Math.min(14, best.ch / 8.6, best.cw / 13));   /* 최대화해도 14px 를 넘지 않는다 */
  g.style.setProperty("--cf", cf.toFixed(1) + "px");
  const lh = cf * 1.32;                        /* 한 줄 높이 — 칸에 들어가는 줄 수로 보여 줄 줄을 정한다 */
  const rows = (best.ch - cf * 0.9) / lh;
  g.classList.toggle("r3", rows < 3.4);        /* 번호·상태·콘텐츠만 */
  g.classList.toggle("r4", rows >= 3.4 && rows < 4.6);
  g.classList.toggle("r5", rows >= 4.6 && rows < 5.6);
  g.classList.toggle("r6", rows >= 5.6 && rows < 6.6);
  g.classList.toggle("r7", rows >= 6.6 && rows < 8.6);   /* 이보다 크면 최근 활동 기록까지 보인다 */
}
window.addEventListener("resize", () => { if(DATA) paint(); });

/* ---------- 오래된 기록 지우기 ---------- */
$("bClean").onclick = async () => {
  const days = Number(prompt("며칠 지난 기록을 지울까요? (예: 30)\n※ 점수 기록(역대 최고)은 지우지 않습니다.", "30"));
  if(!(days > 0)) return;
  const limit = serverNow() - days*24*3600*1000;
  const old = Object.keys(SESS).map(Number).filter((ms) => ms < limit);
  if(!old.length){ alert("지울 기록이 없습니다."); return; }
  if(!confirm(old.length + "개 수업의 기록을 지웁니다. 계속할까요?")) return;
  for(const ms of old){
    await remove(ref(db, "mk/ev/" + ms));
    await remove(ref(db, "mk/sessions/" + ms));
    delete EV[ms];
  }
  alert(old.length + "개 수업을 지웠습니다.");
};

/* ---------- 날짜 ---------- */
function goDay(ms){
  DAY = Math.min(startOfDay(ms), today());     /* 오지 않은 날은 볼 것이 없다 */
  BLK = null;
  $("dayPick").value = ymdStr(DAY);
  $("dayPick").max = ymdStr(today());
  $("bToday").classList.toggle("on", isToday());
  $("bNext").disabled = isToday();
  syncSubs();
  render();
}
$("bToday").onclick = () => goDay(today());
$("bPrev").onclick  = () => goDay(DAY - DAY_MS);
$("bNext").onclick  = () => goDay(DAY + DAY_MS);
$("dayPick").onchange = () => {
  const v = $("dayPick").value;
  if(!v) { $("dayPick").value = ymdStr(DAY); return; }
  const [y, m, d] = v.split("-").map(Number);
  goDay(new Date(y, m-1, d).getTime());
};
goDay(today());

/* 기록이 남아 있는 날들 — 눌러서 바로 간다 */
function paintDaybar(){
  const days = [...new Set(Object.keys(SESS).map((ms) => startOfDay(Number(ms))))];
  if(!days.includes(today())) days.push(today());
  if(!days.includes(DAY)) days.push(DAY);
  days.sort((a, b) => b - a);
  const html = days.map(ms => '<option value="' + ms + '">' + mdw(ms) + (ms === today() ? " 오늘" : "") + '</option>').join("");
  const sel = $("daySel");
  if(sel.innerHTML !== html) sel.innerHTML = html;
  sel.value = String(DAY);
}
$("daySel").onchange = () => goDay(Number($("daySel").value));
document.addEventListener("click", (e) => { const m = $("more"); if(m && m.open && !m.contains(e.target)) m.open = false; });
$("cap").oninput = () => { if(DATA) paint(); };

/* 실시간으로 받으므로 새로 묻지 않는다. 다만 '몇 초 전' 표시는 1초마다 다시 쓴다. */
setInterval(() => {
  if(DATA && isToday() && (DATA.live || DATA.running) && document.visibilityState === "visible") paint();
}, 1000);
